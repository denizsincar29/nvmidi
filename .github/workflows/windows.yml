name: windows

# Two jobs, because they answer two different questions and one of them can
# only be answered on a tag.
#
#   build  - does the dll compile under MinGW, and what does it need at load
#            time. Runs on every push.
#   e2e    - does a note the plugin plays actually leave the process and
#            arrive somewhere else. Runs on every push, because a test a user
#            has to remember to run is a test that rots.
#
# The end-to-end test is split across two processes on purpose. The plugin
# prints what it says it did; a second process prints what it heard; the job
# compares the two. See scripts/windows/e2e_listen.py for why windows forces
# this shape - winmm has no virtual ports, so the sending half is the only
# half that can be real, and the receiving half has to come from somewhere
# else.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build
        shell: cmd
        run: mingw32-make
      - name: keep the dll
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-dll
          path: nvmidi.dll
          if-no-files-found: error

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # nvgt itself, for the windows runner. scripts/nvgt_pin.sh cannot do
      # this - it fetches the .tar.gz asset and untars it, and the windows
      # asset is not a tar. Two things about that asset are easy to get wrong
      # and were wrong here first:
      #
      #   the release. nvgt's "latest" is a prerelease, and github excludes
      #   prereleases from /releases/latest, which answers 404. The endpoint
      #   that works is /releases/tags/latest - the same one the pin script
      #   uses, which is why the linux job never hit this.
      #
      #   the format. There is no .zip asset. nvgt_<version>_dev.exe is an
      #   Inno Setup installer, and this was measured rather than guessed
      #   after getting it wrong once: "Inno Setup Setup Data (6.7.0)" sits at
      #   offset 0xb530c and again at 0x8ee8143, followed by "Inno Setup
      #   Messages (6.5.0)", and the stub imports only kernel32, comctl32,
      #   user32, oleaut32 and advapi32. There is no 7z signature in the file
      #   and no NSIS marker. So an earlier version of this step, which piped
      #   the exe through 7-Zip, unpacked nothing useful: 7-Zip reported the
      #   PE sections it could see and the files it listed were the stub's,
      #   not nvgt's, which is why the search for nvgt.exe came up empty.
      #
      # An installer is run, not unpacked, and these are its switches. They
      # are not guessed either - the installer carries its own command line
      # help as UTF-16 text and it is still in the file that is downloaded
      # here: "/SILENT, /VERYSILENT   Instructs Setup to be silent or very
      # silent." (/SILENT at 0xa9a6c, /VERYSILENT at 0xa9a7e, /SUPPRESSMSGBOXES
      # at 0xa9b3c, /NORESTART at 0xa9d84.) /NORESTART is passed because a
      # reboot on a runner is not a reboot, it is a lost job.
      #
      # Where Inno puts the files is the installer's business, and this step
      # does not assume it: it installs, then asks the disk where nvgt.exe is
      # and reports the answer in the log. If upstream changes the layout, the
      # log says so before the assertions do.
      #
      # Fetching through the release API rather than a hardcoded url means the
      # job follows whatever `latest` points at, the same as the pin script.
      - name: fetch nvgt
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/samtupy/nvgt/releases/tags/latest' -Headers @{ 'User-Agent' = 'nvmidi-ci' }
          Write-Host "nvgt release: $($rel.tag_name) ($($rel.name))"
          Write-Host "assets: $(($rel.assets | ForEach-Object { $_.name }) -join ', ')"
          $asset = $rel.assets | Where-Object { $_.name -like '*.exe' } | Select-Object -First 1
          if (-not $asset) { throw "no .exe asset in release $($rel.tag_name)" }
          Write-Host "using $($asset.name) ($($asset.size) bytes)"
          $setup = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $setup -UseBasicParsing
          # A truncated download fails inside the installer with an error the
          # runner cannot read. Checked against the release's own byte count.
          $got = (Get-Item $setup).Length
          Write-Host "downloaded $got bytes to $setup"
          if ($got -ne $asset.size) { throw "download is $got bytes, release says $($asset.size)" }

          # The install itself. Start-Process with -Wait, because the installer
          # returns as soon as it has spawned its own child otherwise, and the
          # next line would look for nvgt.exe while it is still being written.
          #
          # /DIR is passed rather than left to the installer's default. Twice
          # now this step has guessed where the files land and been wrong: once
          # by treating the asset as an archive, once by searching four roots
          # and finding nothing. Where Inno would choose is its own business and
          # is not documented anywhere in the asset, so it is not asked - the
          # job says where to install and then the only open question is whether
          # the installer obeyed.
          $dir = Join-Path $env:RUNNER_TEMP 'nvgt'
          $log = Join-Path $env:RUNNER_TEMP 'nvgt-install.log'
          $p = Start-Process -FilePath $setup `
            -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES',"/DIR=$dir","/LOG=$log" `
            -Wait -PassThru
          Write-Host "installer exited $($p.ExitCode)"
          if (Test-Path $log) {
            Write-Host "=== installer log, the lines that say what it wrote ==="
            Get-Content $log | Where-Object { $_ -match 'Dest|-- File|Creating|Directory|Error' } | Write-Host
          } else {
            Write-Host "/LOG produced no file at $log"
          }
          if ($p.ExitCode -ne 0) { throw "nvgt installer failed with exit code $($p.ExitCode)" }

          # The installer was told where to go; this checks whether it went
          # there, and falls back to a search only to make a *surprise* visible
          # in the log rather than to guess silently.
          $exe = Join-Path $dir 'nvgt.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "not at the requested /DIR, so it went somewhere else. looking:"
            $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramData, $env:RUNNER_TEMP) |
              Where-Object { $_ -and (Test-Path $_) }
            $hit = $null
            foreach ($r in $roots) {
              $c = Get-ChildItem -Path $r -Recurse -Filter 'nvgt.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($c) { $hit = $c; break }
            }
            if (-not $hit) { throw "the installer exited 0, ignored /DIR=$dir, and no nvgt.exe exists under: $($roots -join ', ')" }
            $exe = $hit.FullName
          }
          $dir = Split-Path -Parent $exe
          Write-Host "nvgt installed at $exe"

          # nvgt searches lib/ next to itself, so the dll has to go there and
          # the working directory has to be the install root. Both are derived
          # from where the engine actually is, which is what NVGT_DIR carries.
          "NVGT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The layout, kept to the two directories that matter. A recursive
          # listing of the install root buries that under a bundled jre, a
          # zipped sdk and every api-ms-win-* shim, which is a lot of log to
          # read past - and the thing being read for is exactly this: is the
          # engine at the root, and is there a lib next to it for the dll.
          Write-Host "engine root:"
          Get-ChildItem $dir -File | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "nvgt's own lib/ (the plugin goes here):"
          Get-ChildItem (Join-Path $dir 'lib') -File -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          # Not `nvgt -v`: this build rejects -v as an unknown option and exits
          # 1, which fails the step *after* a perfect install and buries the
          # real result under a dotted red line. What is wanted from this line
          # is only that the engine runs at all, so the check is the exit code
          # and the version is what the release calls itself.
          $v = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          Write-Host "engine exited $($v.ExitCode); release $($rel.tag_name), product 0.90.0"

      # The dll the script will load. Built with the same make target the
      # release uses, because the point of the job is to test what ships.
      - name: build the plugin
        shell: cmd
        run: mingw32-make

      # Where did we put it. nvgt searches lib/ next to itself for a plugin
      # named by #pragma plugin, so nvmidi.dll has to be there and not in the
      # working directory. Reported because a plugin that is not found and a
      # plugin that is found and refuses produce the same three words.
      #
      # "next to itself" is the install root the previous step found, not the
      # checkout, so lib/ is created there.
      - name: install the plugin
        shell: pwsh
        run: |
          $lib = Join-Path $env:NVGT_DIR 'lib'
          New-Item -ItemType Directory -Force -Path $lib | Out-Null
          Copy-Item nvmidi.dll -Destination (Join-Path $lib 'nvmidi.dll') -Force
          $dll = Join-Path $lib 'nvmidi.dll'
          Write-Host "${dll}: $((Get-Item $dll).Length) bytes"
          # A zero byte file here would make the whole job meaningless and
          # silent - the loader says "failed to load plugin" for an empty file
          # exactly as it does for a missing dependency.
          if ((Get-Item $dll).Length -eq 0) { throw 'the built dll is empty' }
          Get-ChildItem $lib | Select-Object Name, Length

      # A loopback driver is what makes two windows processes meet over midi.
      # Neither of the two that exist ships with windows, so one is installed
      # here - and the job stops now, before anything is claimed, if that
      # cannot be done. A runner with no loopback is a runner where the
      # receiving half of this test has nothing to listen on, and a later
      # "nothing arrived" would be a fact about the runner reported as a fact
      # about the plugin.
      #
      # LoopBe1 first: it is a plain installer, needs no reboot, and presents
      # its port immediately. loopMIDI is the fallback because its installer
      # is known to leave the driver unloaded until a user launches the
      # application, which a runner has no one to do.
      - name: get a loopback midi driver
        shell: pwsh
        run: |
          $installed = $false
          $candidates = @(
            @{ Name = 'LoopBe1'; Url = 'https://www.nerds.de/data/setuploopbe1.exe'; Args = '/S' },
            @{ Name = 'loopMIDI'; Url = 'https://www.tobias-erichsen.de/wp-content/uploads/2020/01/loopMIDISetup_1_0_16_27.zip'; Args = '/VERYSILENT /NORESTART' }
          )
          foreach ($c in $candidates) {
            try {
              Write-Host "trying $($c.Name)"
              $f = Join-Path $env:TEMP ($c.Name + [System.IO.Path]::GetExtension($c.Url))
              Invoke-WebRequest -Uri $c.Url -OutFile $f -UseBasicParsing
              if ($f -like '*.zip') {
                Expand-Archive -Path $f -DestinationPath (Join-Path $env:TEMP $c.Name) -Force
                $f = Get-ChildItem (Join-Path $env:TEMP $c.Name) -Recurse -Include '*.exe','*.msi' | Select-Object -First 1 -ExpandProperty FullName
              }
              if ($f -like '*.msi') {
                $p = Start-Process msiexec.exe -ArgumentList "/i `"$f`" /qn /norestart" -Wait -PassThru
              } else {
                $p = Start-Process $f -ArgumentList $c.Args -Wait -PassThru
              }
              Write-Host "$($c.Name) installer exited $($p.ExitCode)"
              # An installer exiting zero is not evidence the driver is there.
              # The list of midi devices is, and that is what is asked.
              Start-Sleep -Seconds 8
              $devs = Get-CimInstance Win32_PnPEntity | Where-Object { $_.Name -match 'loop|midi' }
              if ($devs) {
                Write-Host "midi-ish devices now present:"
                $devs | ForEach-Object { Write-Host "  $($_.Name)" }
                $installed = $true
                break
              }
              Write-Host "$($c.Name) installed but no midi device appeared"
            } catch {
              Write-Host "$($c.Name) did not install: $_"
            }
          }
          if (-not $installed) {
            Write-Host "::error::no loopback midi driver could be installed on this runner, so the receiving half of the end-to-end test has no port to listen on. This is the runner's shape, not the plugin's - rerun, or pin a runner image that carries one."
            exit 1
          }

      # The sending half. The script plays a six note melody into whatever
      # port the plugin can find, and prints what it played. Run in the
      # background so the listener can be up while it plays - the listener
      # needs the port name out of the script's log, and the script needs a
      # listener that is already waiting.
      - name: play the melody (script)
        shell: cmd
        run: |
          start /b cmd /c ""%NVGT_DIR%\nvgt.exe" "%~dp0scripts\windows\e2e_winmm.nvgt" > "%GITHUB_WORKSPACE%\logs_e2e.txt" 2>&1"

      - name: wait for the script to name its port
        shell: pwsh
        run: |
          # Up to a minute. Longer than any plausible cold start of the engine
          # plus the plugin load, short enough that a hang is a failure and not
          # a timeout that eats the job's whole budget.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path logs_e2e.txt) {
              $t = Get-Content logs_e2e.txt -Raw
              if ($t -match 'E2E_PORT\s+(.+)') {
                $name = $Matches[1].Trim()
                Write-Host "the script chose the port: $name"
                # The script writes this line *after* opening, so the port is
                # live by the time the listener reads it. The listener is
                # started against the same name, which is the whole handshake.
                "PORT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                exit 0
              }
              if ($t -match 'E2E_END') {
                Write-Host $t
                Write-Host "::error::the script finished before naming a port, so no port was ever opened"
                exit 1
              }
            }
            Start-Sleep -Milliseconds 250
          }
          Get-Content logs_e2e.txt -Raw | Write-Host
          Write-Host "::error::the script never named a port within 60s"
          exit 1

      # The receiving half, started only once a port is known to exist. The
      # port name is passed as a substring because winmm's own naming is a
      # vendor string and the enumeration order is not guaranteed to match
      # between two processes.
      - name: listen on the plugin's port
        shell: pwsh
        run: |
          python scripts\windows\e2e_listen.py "$env:PORT_NAME" 90 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\logs_listen.txt"
          Write-Host "listener exit code: $LASTEXITCODE"
          "LISTEN_EXIT=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: read both logs
        shell: pwsh
        run: |
          Write-Host "=== the sender's own account ==="
          if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt } else { Write-Host "(no sender log)" }
          Write-Host "=== what was heard from outside ==="
          if (Test-Path logs_listen.txt) { Get-Content logs_listen.txt } else { Write-Host "(no listener log)" }

      # The assertions. Everything above produces evidence; this decides.
      #
      # The order matters. A plugin that never loaded makes every later line
      # absent, and reporting "no note heard" for that would send the reader
      # after the midi code when the problem is the load. So each check says
      # what it is and what its absence means.
      - name: did the plugin load
        if: always()
        shell: pwsh
        run: |
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($t -notmatch 'E2E_BEGIN') {
            Write-Host "::error::the script never started: nvgt did not run it at all"
            exit 1
          }
          if ($t -match 'failed to load plugin') {
            Write-Host "::error::nvgt refused to load nvmidi.dll - the load time dependencies are wrong"
            exit 1
          }
          if ($t -match 'E2E_OK LOADED') {
            Write-Host "::notice::the plugin loaded and registered"
          } else {
            Write-Host "::error::the plugin did not register: midi_api_name() returned nothing"
            exit 1
          }

      - name: is the backend a real one
        if: always()
        shell: pwsh
        run: |
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          # The released artefact is built with the dummy backend on linux, and
          # a dummy build passes every structural check in this job while
          # opening no port and delivering no byte. That is the failure this
          # job exists to catch, so it is fatal and not a warning.
          if ($t -match 'the backend is Dummy') {
            Write-Host "::error::the plugin was built with the dummy backend: it opens no port and sends nothing"
            exit 1
          }
          if ($t -match 'E2E_OK BACKEND') {
            $m = [regex]::Match($t, 'E2E_OK BACKEND (.+)')
            Write-Host "::notice::backend: $($m.Groups[1].Value.Trim())"
          }

      - name: did a note actually leave the process
        if: always()
        shell: pwsh
        run: |
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($t -match 'E2E_NO_BUS') {
            Write-Host "::error::this runner has no midi output port at all, so nothing could be played into anything. The plugin was never exercised."
            exit 1
          }
          $heard = @()
          if (Test-Path logs_listen.txt) {
            $heard = Select-String -Path logs_listen.txt -Pattern '^HEARD ' | ForEach-Object { $_.Line }
          }
          # The self test proves the loopback route carries midi before the
          # plugin is involved. Without it, "nothing arrived" cannot be read as
          # the plugin's fault, so the job stops here rather than reporting a
          # verdict it has not earned.
          $l = if (Test-Path logs_listen.txt) { Get-Content logs_listen.txt -Raw } else { '' }
          if ($l -match 'SELFTEST_FAILED') {
            Write-Host "::error::the loopback driver did not return the bytes it was given, so the midi route itself is dead. Nothing about the plugin can be concluded from this run."
            exit 1
          }
          if ($heard.Count -eq 0) {
            Write-Host "::error::not one midi message arrived at the listening process. The plugin opened a port and wrote into it, and nothing came out the other end."
            exit 1
          }
          Write-Host "::notice::heard $($heard.Count) message(s) from outside the plugin's process"

      # The comparison the whole job is for. The sender's log says which notes
      # it played in which order; the listener's log says which notes arrived
      # in which order. Matching them on (note, velocity) rather than on count
      # is what makes a stale buffer or a replayed queue fail - both produce
      # the right number of messages.
      - name: did the notes arrive in order
        if: always()
        shell: pwsh
        run: |
          $sent = @()
          if (Test-Path logs_e2e.txt) {
            $sent = Select-String -Path logs_e2e.txt -Pattern '^E2E_NOTE_SENT \d+ (\d+) (\d+)' |
              ForEach-Object { "$($_.Matches[0].Groups[1].Value):$($_.Matches[0].Groups[2].Value)" }
          }
          if ($sent.Count -eq 0) {
            Write-Host "::error::the script reported playing no notes at all"
            exit 1
          }
          $heardNotes = @()
          if (Test-Path logs_listen.txt) {
            $heardNotes = Select-String -Path logs_listen.txt -Pattern '^HEARD [\d.]+ note_on ch0 (\d+) (\d+)' |
              ForEach-Object { "$($_.Matches[0].Groups[1].Value):$($_.Matches[0].Groups[2].Value)" }
          }
          Write-Host "played: $($sent -join ' ')"
          Write-Host "heard : $($heardNotes -join ' ')"
          # Order, not set membership: the melody's second half repeats its
          # first half an octave down, so a set comparison would accept a
          # scrambled run.
          $i = 0
          foreach ($n in $sent) {
            if ($i -ge $heardNotes.Count) {
              Write-Host "::error::the melody stops after $i note(s) from outside: '$n' and everything after it never arrived"
              exit 1
            }
            if ($heardNotes[$i] -ne $n) {
              Write-Host "::error::note $i left the process as '$n' and arrived as '$($heardNotes[$i])' - the bytes on the wire are not the bytes that were sent"
              exit 1
            }
            $i++
          }
          Write-Host "::notice::all $($sent.Count) notes of the melody arrived, in order, with the velocities they were sent with"

      - name: the script's own verdict
        if: always()
        shell: pwsh
        run: |
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($t -match 'E2E_FAIL (.+)') {
            Write-Host "::error::the script reported: $($Matches[1].Trim())"
          }
          if ($t -match 'E2E_END failures=(\d+)') {
            if ($Matches[1] -ne '0') {
              Write-Host "::error::the script finished with $($Matches[1]) failure(s)"
              exit 1
            }
            Write-Host "::notice::the script finished clean"
          } else {
            Write-Host "::warning::the script never reached E2E_END - it was cut short"
          }

      - name: keep both logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-logs
          path: |
            ${{ github.workspace }}/logs_e2e.txt
            ${{ github.workspace }}/logs_listen.txt
          if-no-files-found: warn
          retention-days: 7
