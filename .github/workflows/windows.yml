name: windows

# Two jobs, and neither of them plays a note.
#
#   build  - does the dll compile under MinGW, and what does it need at load
#            time. Runs on every push.
#   rename - does a move onto an existing name replace its bytes. Runs on
#            every push.
#
# Compilation is what this workflow is for, and it is the whole of it. The
# end-to-end run - a note leaving the process and arriving at a listening one
# - is done by hand, by the plugin's own author, on a machine where winmm and
# a desktop exist. It used to live here as a third job and could not hold:
# the receiving half is a user-mode winmm driver that winmm only loads from an
# interactive session, which a hosted runner has not got. The driver is still
# in tools/winmm_loopback/ for that hand run.

on:
  push:
  workflow_dispatch:
    inputs:
      # A measurement, not a setting: with this on, the e2e launch is killed
      # right after the script starts, and the loopback driver's status file
      # then answers whether the process's exit runs the unload path. Off by
      # default and read from the environment, so every push keeps the job
      # byte-for-byte what it was.
      kill_early:
        description: 'kill the e2e script right after the launch'
        type: boolean
        default: false
      kill_at_mark:
        description: 'kill the e2e script at the BACKEND marker, before the send'
        type: boolean
        default: false
env:
  NVMIDI_KILL_EARLY: ${{ inputs.kill_early && '1' || '' }}
  NVMIDI_KILL_AT_MARK: ${{ inputs.kill_at_mark && '1' || '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build
        shell: cmd
        # The compiler that dies in the control build below dies the same way
        # here, and here it is the only thing in the step: if the ordinary
        # build's recipe also stops without a diagnostic, the two commands
        # exit alike and the flag is not what kills it.
        run: |
          mingw32-make
          echo ORDINARY-MAKE-EXITED-WITH=%ERRORLEVEL%
          if not exist nvmidi.dll echo ORDINARY-BUILD-WROTE-NO-DLL
      - name: build the loopback driver
        shell: bash
        # build.sh writes its output beside itself, which is exactly where the
        # artifact upload and the e2e's staged copy look for it. The -o that
        # used to be here named that same path by hand, and build.sh resolves a
        # relative -o against the *caller's* directory - the repository root -
        # so the hand-written path landed one level down, in
        # tools/winmm_loopback/tools/winmm_loopback/. The step still printed
        # "built 52103 bytes", so it read as healthy; what the upload picked up
        # instead was the leftover tools/winmm_loopback/nvmidi.dll from the
        # 2026-09-11 run, 36408 bytes and two commits stale. Measured, run
        # 36709257500: the log's upload lists path tools/winmm_loopback/nvmidi.dll
        # and uploads 16103 bytes of zip, while the step's own output names
        # /d/a/nvmidi/nvmidi/tools/winmm_loopback/tools/winmm_loopback/nvmidi.dll.
        # A stale driver under the right name is worse than a missing one: every
        # later step tests it and reports the result as this build's.
        run: bash tools/winmm_loopback/build.sh

      - name: every function the compiler emits is one the driver expects to be called
        shell: bash
        # The loopback dll dies during load with an execute fault (AV.Fault:
        # Execute, ExceptionAddress = its own base + 0x15e6) and no status line,
        # so the fault is inside DllMain - the loader points the process at its
        # own exception handler for the duration of DLL_PROCESS_ATTACH, which is
        # why crash_filter never fires for it. No width or argument-count
        # mistake can fault like that: every store those mistakes make lands
        # inside the frame of the function that makes it.
        #
        # -Wmissing-prototypes is what does. mmiscapi.h declares DRIVERMSGPROC
        # as taking five arguments, and PDRVCALLBACK as taking six plus a
        # DWORD_PTR. A definition in this file that disagrees with either one
        # has no prototype, so the compiler hands the callee a frame built for
        # its own (shorter) signature and the callee decodes the arguments from
        # a frame that is not what it expects - an execute fault, exactly the
        # shape measured. This gate is here because that class of mismatch is
        # invisible by eye and was never checked.
        run: |
          echo "--- definitions with no prototype ---"
          flags="-O2 -municode -DUNICODE -D_UNICODE -I/usr/x86_64-w64-mingw32/include"
          x86_64-w64-mingw32-gcc -fsyntax-only -Wall -Wextra -Wmissing-prototypes \
            $flags tools/winmm_loopback/nvmidi_loopback.c 2>&1 |
            grep -E "warning:" || echo "(none)"


      - name: keep the driver next to the dll
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-loopback
          path: tools/winmm_loopback/nvmidi.dll
          if-no-files-found: error

      # `move` cannot do this job at all, and now that is a measurement rather
      # than a suspicion.
      #
      # The isolated `rename` job promotes a file onto a name that already
      # exists and asks cmd to move onto it. Run 36706131852: cmd printed
      # "1 file(s) moved.", removed the source, exited 0, and left the
      # destination holding the OLD bytes. No error, no warning, no non-zero
      # exit. Two builds of one source cannot be obtained by renaming in this
      # shell, because the failure is silent in both directions - a build job
      # that trusts it ships the first library twice, and every comparison
      # downstream then measures one build against itself and reports a clean
      # pair of results.
      #
      # So no step of this workflow renames anything. Both builds live in
      # directories of their own, each holding one library under the name the
      # engine actually asks for, and the difference between them is the
      # directory. That also closes the trap the probe kept falling into: two
      # rows labelled differently stopped being two files the moment one
      # directory had to hold both, and a name is not evidence of contents.
      #
      # make runs from the root through -f, with a relative -o: make's own
      # directory is the root either way, and the write lands where -o points.
      # The first build is moved out of the root rather than deleted, because
      # the e2e job has steps that read it there.
      #
      # The flag lives in the Makefile's own recipe for this target and nowhere
      # else, because every way of passing it from here was tried and each one
      # failed for a different reason. A bare -DNVGT_SKIP_ARRAY_ADDON after the
      # target is make syntax, not a compiler flag: run 36706922550 printed
      # "invalid option -- D" and a line per letter before refusing the target.
      # A command-line CXXFLAGS= replaces the variable the windows branch uses
      # to add -D__WINDOWS_MM__, so the build silently takes the Linux RtMidi
      # branch and writes no dll while exiting 0 (run 36702495507). And a
      # command-line variable that is merely read by the recipe does not arrive
      # there at all: run 36708862123 asked for this target with
      # EDGE=nvmidi-noarr.dll on the command line and make answered with
      # nothing but its own Entering and Leaving lines.
      #
      # What made the earlier attempts invisible was `-o`, and that is the
      # measurement this step is now built around. Asking for a target with
      # `-o <file>` tells make to treat that file's rule as already done, so
      # run 36709257500 compiled nothing at all and said so in the one line the
      # step had been throwing away - "Nothing to be done for 'all'" - while
      # exiting 0. The step had been reading that as a library quietly missing
      # its export table, and then as a compiler that dies after nvmidi.cpp:2093
      # with no diagnostic. Neither existed: the compile was simply never
      # started. The target's prerequisite is the dll that the ordinary build
      # wrote moments earlier, which is what makes -B necessary here, and the
      # recipe's own output goes to this step's stdout rather than into a file,
      # because a cmd step's write to a file goes into the process stdout buffer
      # and never reaches the disk.
      - name: build the library without the array add-on
        shell: pwsh
        # Written in PowerShell because the shell this step used to ask for was
        # not the shell it got. `shell: cmd` selects an executable, but this
        # runner inherits SHELL from the job environment - the build job sets
        # MSYS2 - and under bash every cmd built-in in the old step was a
        # command that does not exist: `type nul` and `for %f in (...)` were
        # answered with "command not found", `if not exist ... exit /b 1` did
        # nothing and exited 0, and no file was ever moved. Measured, run
        # 36710220453: the step's own output line is
        # "/usr/bin/bash: line 1: type: nul: not found". So the step had never
        # once run the cmd it was written in, and the dll it was supposed to
        # produce was never produced. `shell: pwsh` is an explicit path to
        # pwsh.exe and does not go through SHELL.
        #
        # The control is built into a name of its own as of commit 15c2a01, so
        # nothing has to be moved out of the way and the two builds can sit in
        # one directory at one time. Measured, run 36723890974, which is the run
        # this step's shape was chosen on: with the recipe still writing
        # $(TARGET), the control build wrote the *ordinary* binary - 2988213
        # bytes, byte for byte what was moved into withaddon/ - and both
        # artifacts of that run carried that same library. Both were labelled
        # no-addon and neither was one. The artifact README's size claim was
        # the only thing that could have caught it, and a size claim is not a
        # measurement.
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force withaddon, noaddon | Out-Null
          Move-Item -Force nvmidi.dll withaddon/nvmidi.dll
          if (-not (Test-Path withaddon/nvmidi.dll)) { throw 'the ordinary build left no dll to move' }
          if (Test-Path nvmidi.dll) { throw 'the ordinary dll is still in the root' }
          Write-Host "WITH-ADDON-BYTES $((Get-Item withaddon/nvmidi.dll).Length)"

          # The second build, in one step with no `-o` and no move after it:
          # the recipe names its own output now, so the file has to exist where
          # the recipe said it would and the ordinary dll has to be untouched.
          # Both are checked rather than assumed, because both were wrong in
          # run 36723890974 and the step went green anyway.
          mingw32-make --print-directory -f Makefile -B nvmidi-noarr.dll
          Write-Host "MAKE-EXIT $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw 'the make for the no-addon build failed' }
          if (-not (Test-Path nvmidi-noarr.dll)) { throw 'the no-addon build wrote no nvmidi-noarr.dll' }
          if (-not (Test-Path withaddon/nvmidi.dll)) { throw 'the no-addon build disturbed the ordinary dll' }

          Move-Item -Force nvmidi-noarr.dll noaddon/nvmidi.dll
          Write-Host "NO-ADDON-BYTES $((Get-Item noaddon/nvmidi.dll).Length)"

          # The third build, for the e2e job. Every case there carries
          # `#pragma plugin nvmidi`, so all of them load this name from the
          # workspace root; until now that name always held the ordinary build,
          # the one that calls the engine's array add-on first thing inside
          # register_nvmidi. Six of the eight cases exit 0 in that build and one
          # dies, and the compiler refusal of the eighth is the only thing that
          # tells them apart - which is not a statement about the plugin.
          #
          # Built here rather than in the e2e job because the e2e job has no
          # compiler: it runs the engine against a library the build job wrote.
          # The recipe is nvmidi-e2e.dll; it is copied to nvmidi.dll here, and
          # this job's later steps read the root nvmidi.dll for the .def export
          # check, so the copy is a thing the reader below can see rather than
          # an accident waiting for whoever edits this next.
          mingw32-make --print-directory -f Makefile -B nvmidi-e2e.dll
          Write-Host "MAKE-E2E-EXIT $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw 'the make for the e2e build failed' }
          if (-not (Test-Path nvmidi-e2e.dll)) { throw 'the e2e build wrote no nvmidi-e2e.dll' }
          if (-not (Test-Path withaddon/nvmidi.dll)) { throw 'the e2e build disturbed the ordinary dll' }
          Write-Host "E2E-BYTES $((Get-Item nvmidi-e2e.dll).Length)"

          # The control is the control only if the add-on's *call* is not in it,
          # and that is a different question from whether the add-on's strings
          # are in it - which is what the check here used to ask, by counting
          # the log line the call prints. It counted wrong, and the measure is
          # in the source file beside the line: run 36753050043, one marker in
          # each build, so the control was failed for carrying the call at the
          # moment the control was correct. A literal in a file that links
          # scriptarray.o is present whatever branch holds it and whether or not
          # that branch is ever reached; the text the registration itself hands
          # the engine is the same string a second time.
          #
          # The returned-call line is the one literal that answers it. It sits
          # after RegisterScriptArray in the branch the control compiles away,
          # and it appears in no other part of this plugin or of the add-on, so
          # a hit is only produceable by the call having returned.
          #
          # The check the e2e probe later makes reads `calling=` the same way;
          # doing it here means a build that wrote the wrong file fails at the
          # build instead of being discovered in the probe step that consumes
          # it, where the two builds have already been copied around each other.
          $withAddon = [System.IO.File]::ReadAllBytes((Resolve-Path 'withaddon/nvmidi.dll'))
          $noAddon   = [System.IO.File]::ReadAllBytes((Resolve-Path 'noaddon/nvmidi.dll'))
          function Count-Needle([byte[]]$haystack, [string]$needle) {
            $n = [System.Text.Encoding]::ASCII.GetBytes($needle)
            $hits = 0
            for ($i = 0; $i -le $haystack.Length - $n.Length; $i++) {
              $ok = $true
              for ($j = 0; $j -lt $n.Length; $j++) { if ($haystack[$i + $j] -ne $n[$j]) { $ok = $false; break } }
              if ($ok) { $hits++ }
            }
            return $hits
          }
          #
          # The needle is the literal that only ONE of the two builds can
          # carry, and which one it is was read off the control flow rather
          # than assumed - the previous two needles here were both assumed and
          # both wrong.
          #
          # 'RegisterScriptArray returned' is the line that was here and it
          # answers nothing: it is printed at the END of the else arm of
          # `if (engine_knows_arrays() && array_is_usable())`, and in a control
          # build that arm is exactly where control goes. The flag makes
          # engine_knows_arrays() answer true without looking (the detection
          # below it is compiled out), and with no array<int> registered
          # array_is_usable() answers false - so the conjunction is false, the
          # else runs, and the control carries 'calling RegisterScriptArray'
          # AND 'RegisterScriptArray returned'. Both of them. The old assert
          # `if ($inNo -ne 0) { throw }` could therefore never pass, whatever
          # the two artifacts were, and the mislabelling it was meant to catch
          # was never what it measured.
          #
          # What is true by construction is narrower than it looked: the then
          # arm's line is reachable only when the detection answered, which the
          # flag makes impossible - but a PREFIX of that line is not, and the
          # prefix is what was asked for first. Measured, run 36755407596:
          #
          #   WITH-ADDON-ONLY with-addon=1 no-addon=1
          #   CONTROL-ONLY    with-addon=0 no-addon=1
          #
          # and the located neighbourhood says why: 'the engine already has
          # array<T' appears in BOTH files, because array_is_usable() opens its
          # own branches with the same words and a control reaches that method -
          # the flag makes engine_knows_arrays() answer true, no array<int> is
          # registered, so it prints '"array" is taken but no array<int>
          # resolves; the add-on will be called'. A needle has to be a whole
          # printed line, for the same reason the earlier ones failed: two
          # builds from one source share most of their strings.
          #
          # NEITHER READING IS AN ASSERTION ANY MORE, and the measurement is
          # why. In run 36755752129, where the ordinary recipe's own compile
          # carried -DNVGT_SKIP_ARRAY_ADDON, 'the engine has a working array<T>'
          # answered 1 in BOTH files. The located neighbourhood says how: the
          # string survives because scriptarray.cpp defines its own
          # CScriptArray::At(), so the add-on prints the plugin's line even in a
          # build where the plugin cannot reach it. A needle that one link's
          # other object can spell is not a fact about the plugin, and the
          # reading that 'the no-addon file carries it, so the file is one
          # build run twice' was a conclusion about the read, not about the
          # file - the third of that shape in this step.
          #
          # 'NVGT_SKIP_ARRAY_ADDON is set' is weaker still, and by the same
          # mechanism in reverse: the macro expands from the command line, so
          # adding the flag to the ordinary recipe moves that line into both
          # files and a check on it would answer exactly as before. Both lines
          # are therefore printed with their counts and their neighbourhoods,
          # so a disagreement is readable in the log, and nothing is thrown
          # here. What is left as a claim about the pair of artifacts is their
          # sizes and the e2e's own per-build run.
          $withOnly = 'the engine has a working array<T>'
          $ctrlOnly = 'NVGT_SKIP_ARRAY_ADDON is set'
          $inWith = Count-Needle $withAddon $withOnly
          $inNo   = Count-Needle $noAddon   $withOnly
          $ctrlWith = Count-Needle $withAddon $ctrlOnly
          $ctrlNo   = Count-Needle $noAddon   $ctrlOnly
          Write-Host "SEPARATION with-addon-has-array-line=$inWith no-addon-has-array-line=$inNo"
          Write-Host "SEPARATION with-addon-has-flag-line=$ctrlWith no-addon-has-flag-line=$ctrlNo"

          Get-ChildItem withaddon/nvmidi.dll, noaddon/nvmidi.dll, nvmidi-e2e.dll | ForEach-Object { Write-Host ("{0} {1}" -f $_.Length, $_.FullName) }

      - name: keep the dll with the array add-on
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-with-addon
          path: withaddon/nvmidi.dll
          if-no-files-found: error

      - name: keep the dll without the array add-on
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-no-addon
          path: noaddon/nvmidi.dll
          if-no-files-found: error

      # The build the e2e job runs every case against. Same sources as the
      # ordinary build, one `#ifdef` different: no call into the engine's array
      # add-on. It travels as an artifact because the e2e job runs on another
      # runner and has no compiler, and it travels under the name the engine
      # asks for, nvmidi.dll, so the e2e job can stage it with nothing but a
      # copy. The artifact name is what keeps this file apart from the ordinary
      # one in the build job's own storage - the two differ by one call and a
      # reader cannot tell them apart by size.
      - name: keep the dll the e2e job runs
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-e2e
          path: nvmidi-e2e.dll
          if-no-files-found: error

      # The driver has to reach the e2e job, which runs on a different runner:
      # nothing the build job leaves on disk is visible there. The artifact is
      # that hand-off, and every job below that runs after this one downloads
      # it into the workspace at the same path, so the file the e2e stages is
      # the file this step built rather than a copy that has to be kept in step
      # by hand.
      #
      # The second build, and it has to happen here rather than in the e2e.
      #
      # An artifact is a byte stream with a destination name, not a tree: the
      # e2e cannot ask for the same artifact twice under two names, and it
      # cannot rename what it downloads, because the name it writes is the name
      # the file had on the uploading side. So the distinction between the two
      # builds has to exist before the upload - and a filesystem will not hold
      # two files called nvmidi.dll, which is why this is a rename in the middle
      # of the job and not a second artifact.
      #
      # `move`, not `copy`: with both files present the second make finds
      # nvmidi.dll up to date and runs no recipe, so the ordinary build would be
      # published as if it were the no-addon one. Every number after that would
      # be the wrong library's, reported as healthy. Measured, run 36709045673.
      #
      # The rename is spelled out on a line of a `shell: cmd` step because that
      # is the only place it can run: `move` is a cmd built-in, and make on this
      # runner cannot start cmd built-ins at all (runs 36702218450, `del`;
      # 36703826070, `copy`).
      #
      # The question the probe below was built to answer turned out to be a
      # question about cmd, not about `move`. Run 36732075966 asked "does
      # `move /y` replace a name that already exists?" and answered no - but
      # every byte of that answer is `findstr`'s.
      #
      # The destination held `first build`, which means the move left the old
      # file in place. The line that reported it was `findstr /C:"first
      # build" nvmidi-noarr.dll && (...)`, written on the assumption that a
      # successful findstr runs the parenthesised block. It does not: findstr
      # exits 0 on a match, the block runs, and the probe reports the failure
      # it was looking for. That is right. But findstr exits 1 on no match,
      # and `&&` does not run then - so the second check, the one that was to
      # prove the destination holds `second build`, never ran at all on a
      # destination that did hold it. Whichever way the move went, one of the
      # two checks was going to stay silent, and the silence was going to be
      # read as consent by whoever got the other one.
      #
      # So the verdict is not moved onto `move`. The rename still happens in
      # the build job; neither of the two claims about it - that `/y` replaces
      # the destination, or that it does not - is established by this run, and
      # the comments here no longer assert either. What the step checks now is
      # only what it can actually see: the source name is gone and the
      # destination is a file with something in it. Read `first build` versus
      # `second build` out of the log to settle the overwrite question by
      # eye; it is printed above the checks and needs no verdict from
      # findstr.
      #
      # Also recorded here because it cost a run: `/N` is not a no-overwrite
      # flag in this shell - `move /n /y` fails outright with "The syntax of
      # the command is incorrect" and exit 1 (run 36705971611).
  rename:
    runs-on: windows-latest
    steps:
      - name: a move onto an existing name replaces the bytes
        shell: cmd
        run: |
          echo first build > nvmidi.dll
          echo second build > nvmidi-noarr.dll
          move /y nvmidi.dll nvmidi-noarr.dll
          echo --- what the destination holds now:
          type nvmidi-noarr.dll
          if exist nvmidi.dll (
            echo the move left the source name behind
            exit /b 1
          )
          for %%A in (nvmidi-noarr.dll) do if %%~zA EQU 0 (
            echo the destination is empty, so nothing was moved onto it
            exit /b 1
          )
