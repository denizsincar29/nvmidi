name: windows

# Two jobs, because they answer two different questions and one of them can
# only be answered on a tag.
#
#   build  - does the dll compile under MinGW, and what does it need at load
#            time. Runs on every push.
#   e2e    - does a note the plugin plays actually leave the process and
#            arrive somewhere else. Runs on every push, because a test a user
#            has to remember to run is a test that rots.
#
# The end-to-end test is split across two processes on purpose. The plugin
# prints what it says it did; a second process prints what it heard; the job
# compares the two. See scripts/windows/e2e_listen.py for why windows forces
# this shape - winmm has no virtual ports, so the sending half is the only
# half that can be real, and the receiving half has to come from somewhere
# else.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build
        shell: cmd
        run: mingw32-make
      - name: build the loopback driver
        shell: bash
        # -o puts the dll where the artifact upload and the e2e's staged copy
        # both expect it. build.sh resolves a relative -o against the caller's
        # directory, so this path is a path in the workspace and not one inside
        # the driver's own folder. That distinction is the whole bug this flag
        # is here for: without it the driver landed in a build/ subdirectory,
        # and then - once - at a path nobody looked at, which the e2e read as
        # a driver that was never built. That reading sends the reader after a
        # compile problem that does not exist, which is worse than an error.
        run: bash tools/winmm_loopback/build.sh -o tools/winmm_loopback/nvmidi.dll

      - name: does the driver publish a port
        shell: pwsh
        # Loaded here, in this job's own python, and deliberately not through
        # rundll32: a winmm driver is started by winmm calling into the image,
        # and rundll32 is a host with its own loader behaviour around exports,
        # its own exit code conventions, and no reason to be trusted with a
        # driver. The measurement that matters is the one taken in the shape of
        # the process that will really do this, which is the listener - a plain
        # 64 bit python that calls LoadLibraryA and then reads a file. Same
        # loader call, same runtime, so a status line here means the e2e job
        # should see one too and anything it does not see is the e2e's own.
        #
        # continue-on-error stays: a failure here is a finding about the driver
        # and the artifact upload below must still run, so that the file this
        # step judged is the file the next reader can look at.
        continue-on-error: true
        run: |
          $dll = (Resolve-Path "tools\winmm_loopback\nvmidi.dll").Path
          $status = [IO.Path]::ChangeExtension($dll, ".status")
          $crash = [IO.Path]::ChangeExtension($dll, ".crash.txt")
          Remove-Item $status, $crash -ErrorAction SilentlyContinue
          $py = @'
          import ctypes, os, sys, time
          path = sys.argv[1]
          status = os.path.splitext(path)[0] + '.status'
          k = ctypes.WinDLL('kernel32', use_last_error=True)
          k.LoadLibraryA.restype = ctypes.c_void_p
          k.LoadLibraryA.argtypes = [ctypes.c_char_p]
          base = k.LoadLibraryA(path.encode('mbcs'))
          if not base:
              print('LOAD_FAILED error %d' % ctypes.get_last_error()); sys.exit(0)
          print('LOAD_OK base=0x%x' % base)
          for _ in range(40):
              if os.path.exists(status):
                  print('STATUS ' + open(status, errors='replace').read().strip()); break
              time.sleep(0.25)
          else:
              print('STATUS absent after 10s')
          '@
          $py | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\drv.py"
          # Parsed here, in pwsh, before python ever sees it. The previous
          # version of this step built the script with a "@ here-string that had
          # a newline appended to the opening line, which is not a here-string
          # at all - it is an unterminated string, a ParserError, and not one
          # line of the script ever ran. Worse, continue-on-error turned that
          # into a green tick, so the run read as though the driver had been
          # tested when nothing had been executed. The parse is a cheap check
          # that this class of failure cannot pass, and the step is no longer
          # allowed to fail quietly either.
          python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$env:RUNNER_TEMP\drv.py"
          if ($LASTEXITCODE -ne 0) { throw "the driver probe script does not parse" }
          python "$env:RUNNER_TEMP\drv.py" $dll
          if ($LASTEXITCODE -ne 0) { throw "the driver probe exited $LASTEXITCODE" }
          if (Test-Path $crash) { Write-Host "crash: $(Get-Content $crash -Raw)" }

      - name: build the ordering probes
        shell: bash
        # Four binaries from two files. late_midi is the driver's publication
        # code as a dll that runs when whoever loads it decides, and as that
        # dll placed where python's winmm would be; probe_exe and probe_noexe
        # are one source built twice, differing only in whether winmm is in
        # their import table. Nothing here touches the plugin - these exist to
        # answer one question with winmm rather than with a reading of it: does
        # the device list get built when a module in the process first attaches,
        # or when winmm itself loads?
        run: |
          # build_probe.sh defaults CC to plain gcc and keeps set -e. If the
          # image has no x86_64-w64-mingw32-gcc this step fails here, at the
          # build, rather than the matrix step reporting four binaries missing
          # as though the probes had run and written nothing. Whichever
          # compiler is used it has to be the cross one: a probe built by the
          # runner's native gcc would be an exe for a different platform and
          # would not start at all.
          echo "cross compiler: $(command -v x86_64-w64-mingw32-gcc || echo 'NOT ON PATH')"
          export CC=x86_64-w64-mingw32-gcc
          bash tools/winmm_loopback/build_probe.sh late  "$RUNNER_TEMP/probe"
          bash tools/winmm_loopback/build_probe.sh exe   "$RUNNER_TEMP/probe"
          bash tools/winmm_loopback/build_probe.sh noexe "$RUNNER_TEMP/probe"

      - name: does the device list depend on who attaches first
        shell: pwsh
        # The matrix, run in one place so the four answers can be read against
        # each other. Every line ends in the same two numbers - how many output
        # devices winmm reports and whether the mapper opens - and the directory
        # each probe writes its own file into is printed as it is produced
        # rather than searched for afterwards.
        continue-on-error: true
        run: |
          $env:PYTHONNOUSERSITE = '1'
          $py = Split-Path (Get-Command python).Source -Parent
          $dlls = Join-Path $py 'DLLs'
          $probe = "$env:RUNNER_TEMP\probe"
          $play = "$env:RUNNER_TEMP\play"
          New-Item -ItemType Directory -Force -Path $play | Out-Null
          Copy-Item "$probe\late_midi.dll" "$dlls\winmm.dll" -Force

          Write-Host "=== 1. winmm replaced by the probe, then python runs ==="
          Write-Host "(the list is built the moment winmm is first pulled in, so"
          Write-Host " the slot this file publishes at attach is as late as it gets)"
          # The exit code is printed, not only the output. A python that prints
          # its line has unquestionably run; a python that dies inside
          # LoadLibrary still returns a code, and until this was printed this
          # case could not tell "ran and quiet" from "died on the replacement"
          # - which is the one thing it exists to distinguish.
          python -c "print('python ok')" 2>&1 | ForEach-Object { Write-Host "  $_" }
          Write-Host "  python exit code: $LASTEXITCODE"
          Get-ChildItem $dlls -Filter late_midi.status -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName):"; Get-Content $_.FullName | ForEach-Object { Write-Host "    $_" }
          }
          Get-ChildItem $py -Filter late_midi.status -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName):"; Get-Content $_.FullName | ForEach-Object { Write-Host "    $_" }
          }

          Write-Host "=== 2. winmm back to normal, the slot stays published ==="
          Copy-Item "$env:SystemRoot\System32\winmm.dll" "$dlls\winmm.dll" -Force
          python -c "print('python ok')" 2>&1 | ForEach-Object { Write-Host "  $_" }

          # Run one probe and say out loud what came back. The previous version
          # of this step called the binary and printed its output, and printed
          # nothing at all for both cases - which is the same picture whether
          # the process never started, started and wrote nothing, or wrote
          # somewhere this step does not look. A missing file and an exit code
          # are what tell those apart, so both are printed for every case
          # before any status file is read.
          function Show-File($path, $label) {
            if (Test-Path $path) {
              Write-Host "  ${label}:"
              Get-Content $path | ForEach-Object { Write-Host "    $_" }
            } else { Write-Host "  ${label}: absent" }
          }

          function Run-Probe($label, $exe, $dll) {
            Write-Host $label
            if (-not (Test-Path $exe)) { Write-Host "  MISSING BINARY: $exe"; return }
            # Both branches set it. The variable is process-wide and outlives
            # this call, so a case passing $null that only skipped the
            # assignment inherited the previous case's dll: on run 36593841753
            # cases 3 and 4 both named late_midi_as_exe.dll, and the empty-path
            # marker printed twice because it was the same run twice. Clearing
            # it in the else is what makes the two cases differ at all.
            if ($dll) { $env:NVPROBE_DLL = $dll }
            else { Remove-Item Env:\NVPROBE_DLL -ErrorAction SilentlyContinue }
            $out = & $exe 2>&1
            $code = $LASTEXITCODE
            $code = $LASTEXITCODE
            if ($out) { $out | ForEach-Object { Write-Host "  $_" } }
            else { Write-Host "  (no stdout)" }
            Write-Host "  exit code: $code"
          }

          Write-Host "=== 3. our dll loaded before winmm is touched, no winmm import ==="
          # Late-bound, because NVPROBE_DLL is read inside DllMain and that
          # runs before main() ever sees argv - the environment is the only
          # channel that is filled in that early.
          Run-Probe "  probe_noexe, no winmm import" "$probe\probe_noexe.exe" "$probe\late_midi_as_exe.dll"
          Get-ChildItem $play -Filter late_midi.status -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName):"; Get-Content $_.FullName | ForEach-Object { Write-Host "    $_" }
          }
          if (-not (Test-Path "$play\late_midi.status")) { Write-Host "  no late_midi.status in $play" }
          Show-File 'C:\probe_attach_marker.txt' 'probe_attach_marker.txt'
          Show-File 'C:\probe_load_failed.txt' 'probe_load_failed.txt'
          Show-File 'C:\probe_entry.txt' 'probe_entry.txt'

          Write-Host "=== 4. same dll, executable that links winmm ==="
          Run-Probe "  probe_exe, winmm in the import table" "$probe\probe_exe.exe" $null
          Show-File 'C:\probe_attach_marker.txt' 'probe_attach_marker.txt'
          Show-File 'C:\probe_load_failed.txt' 'probe_load_failed.txt'
          Show-File 'C:\probe_entry.txt' 'probe_entry.txt'
          Get-ChildItem $play -Filter late_midi.status -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName):"; Get-Content $_.FullName | ForEach-Object { Write-Host "    $_" }
          }
          if (-not (Test-Path "$play\late_midi.status")) { Write-Host "  no late_midi.status in $play" }

          Write-Host "=== 5. a fresh winmm, slot already in the registry ==="
          Write-Host "(python has never run in this step until now, so its winmm is loaded here)"
          python -c "print('warm')" 2>&1 | ForEach-Object { Write-Host "  $_" }

          Write-Host "--- which process each attach belonged to ---"
          Write-Host "(case 1's attach would carry a host of python.exe; case 2 restored the real winmm)"
          Show-File 'C:\late_midi_host.txt' 'late_midi_host.txt'
          if (Test-Path 'C:\late_midi_host.txt') {
            Get-Content 'C:\late_midi_host.txt' | ForEach-Object { Write-Host "  $_" }
          } else { Write-Host "  no C:\late_midi_host.txt" }

          Write-Host "--- every status file this step produced ---"
          Get-ChildItem $env:RUNNER_TEMP -Recurse -Filter *.status -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "$($_.FullName):"; Get-Content $_.FullName | ForEach-Object { Write-Host "  $_" }
          }
          Write-Host "probe matrix done"

      - name: where windows keeps its midi drivers
        shell: pwsh
        # The previous dump answered half the question and raised the other
        # half. The value we write is there, under the right name, pointing at
        # the right file - and the plugin's own process still enumerates one
        # output device, the phantom at index 0. If the driver had been found
        # and loaded, our own port would be in that list. So winmm is not
        # reading the key we are writing, and the only way to find the key it
        # does read is to look where a real, working midi port leaves its
        # entries. This dumps every location winmm is known to consult, plus
        # the 32-bit mirrors and the mapper's own key, so the next change has
        # a measured target instead of a plausible one.
        continue-on-error: true
        run: |
          $py = @'
          import winreg
          def dump(root, path, label):
              try:
                  k = winreg.OpenKey(root, path, 0, winreg.KEY_READ)
              except OSError as e:
                  print('%s MISSING: %s' % (label, e)); return
              nsub, nval, _ = winreg.QueryInfoKey(k)
              print('%s: %d subkeys, %d values' % (label, nsub, nval))
              for i in range(nval):
                  vn, vd, vt = winreg.EnumValue(k, i)
                  print('   %s = %s' % (vn, vd))
              for i in range(nsub):
                  sn = winreg.EnumKey(k, i)
                  print('   [sub] %s' % sn)
                  try:
                      sk = winreg.OpenKey(k, sn, 0, winreg.KEY_READ)
                      for j in range(winreg.QueryInfoKey(sk)[1]):
                          vn, vd, vt = winreg.EnumValue(sk, j)
                          print('        %s = %s' % (vn, vd))
                      winreg.CloseKey(sk)
                  except OSError as e:
                      print('        unreadable: %s' % e)
              winreg.CloseKey(k)

          HKLM = winreg.HKEY_LOCAL_MACHINE
          dumps = [
           (HKLM, r'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Drivers32', 'Drivers32'),
           (HKLM, r'SOFTWARE\WOW6432Node\Microsoft\Windows NT\CurrentVersion\Drivers32', 'Drivers32 WOW6432'),
           (HKLM, r'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Drivers', 'Drivers (MEDIA)'),
           (HKLM, r'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Userinstallable.drivers', 'Userinstallable.drivers'),
           (HKLM, r'SOFTWARE\Microsoft\Windows\CurrentVersion\Drivers32', 'WinVer Drivers32'),
           (winreg.HKEY_CURRENT_USER, r'Software\Microsoft\Windows\CurrentVersion\Multimedia\MIDIMap', 'HKCU MIDIMap'),
           (winreg.HKEY_CURRENT_USER, r'Software\Microsoft\Windows\CurrentVersion\Multimedia\SystemProfile', 'HKCU SystemProfile'),
          ]
          for r, p, l in dumps:
              dump(r, p, l)
          '@
          $py | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\regkeys.py"
          python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$env:RUNNER_TEMP\regkeys.py"
          if ($LASTEXITCODE -ne 0) { throw "the registry key probe does not parse" }
          python "$env:RUNNER_TEMP\regkeys.py"

      - name: keep the driver next to the dll
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-loopback
          path: tools/winmm_loopback/nvmidi.dll
          if-no-files-found: error

      # The driver has to reach the e2e job, which runs on a different runner:
      # nothing the build job leaves on disk is visible there. The artifact is
      # that hand-off, and every job below that runs after this one downloads
      # it into the workspace at the same path, so the file the e2e stages is
      # the file this step built rather than a copy that has to be kept in step
      # by hand.
      - name: keep the dll
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-dll
          path: nvmidi.dll
          if-no-files-found: error

  e2e:
    runs-on: windows-latest
    # needs, and not runs-on alone: the driver arrives as an artifact of *this*
    # run's build job, and a download started before that job has reached its
    # upload step is answered "artifact not found" rather than made to wait.
    # Jobs queued by one push start together, so without this the e2e asked for
    # the driver 54 seconds before the build uploaded it - three runs in a row,
    # each reporting as missing an artifact that was valid and unexpired the
    # whole time. The build job is about a minute; serialising on it costs that
    # minute and buys a hand-off that cannot race.
    needs: build
    # Reading a release asset of the nvgt repository is what fetches the
    # engine, and the token that can do that is the run's own. The default for
    # a repository created before this line existed is read everywhere, but
    # naming it means a future tightening of the repository default cannot
    # silently turn the engine download into a 404.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # A shallow checkout is not what this job wants: the block that
          # measures the script is meant to be able to tell a stale copy from
          # this commit's copy, and a depth-1 tree is one more way for those to
          # differ. It is also where the expected sha is taken from, and that
          # has to be the commit's tree rather than anything reconstructed on
          # the runner.
          fetch-depth: 0

      # The driver is built on the other runner and no filesystem is shared
      # between jobs, so the artifact is the only way it can arrive. It lands
      # at the path the build job uploaded it from, which is the path the
      # staging step below reads - one path, written down once, rather than a
      # copy that has to be kept in step by hand.
      #
      # This is the first step of a job that waits for the build job, so the
      # artifact is on the api by construction and not by timing. That is the
      # point of the wait: the failure this replaced was a download that ran
      # first and read a real artifact's absence.
      - name: fetch the loopback driver
        uses: actions/download-artifact@v4
        with:
          name: nvmidi-loopback
          path: tools/winmm_loopback

      # nvgt itself, for the windows runner. scripts/nvgt_pin.sh cannot do
      # this - it fetches the .tar.gz asset and untars it, and the windows
      # asset is not a tar. Two things about that asset are easy to get wrong
      # and were wrong here first:
      #
      #   the release. nvgt's "latest" is a prerelease, and github excludes
      #   prereleases from /releases/latest, which answers 404. The endpoint
      #   that works is /releases/tags/latest - the same one the pin script
      #   uses, which is why the linux job never hit this.
      #
      #   the format. There is no .zip asset. nvgt_<version>_dev.exe is an
      #   Inno Setup installer, and this was measured rather than guessed
      #   after getting it wrong once: "Inno Setup Setup Data (6.7.0)" sits at
      #   offset 0xb530c and again at 0x8ee8143, followed by "Inno Setup
      #   Messages (6.5.0)", and the stub imports only kernel32, comctl32,
      #   user32, oleaut32 and advapi32. There is no 7z signature in the file
      #   and no NSIS marker. So an earlier version of this step, which piped
      #   the exe through 7-Zip, unpacked nothing useful: 7-Zip reported the
      #   PE sections it could see and the files it listed were the stub's,
      #   not nvgt's, which is why the search for nvgt.exe came up empty.
      #
      # An installer is run, not unpacked, and these are its switches. They
      # are not guessed either - the installer carries its own command line
      # help as UTF-16 text and it is still in the file that is downloaded
      # here: "/SILENT, /VERYSILENT   Instructs Setup to be silent or very
      # silent." (/SILENT at 0xa9a6c, /VERYSILENT at 0xa9a7e, /SUPPRESSMSGBOXES
      # at 0xa9b3c, /NORESTART at 0xa9d84.) /NORESTART is passed because a
      # reboot on a runner is not a reboot, it is a lost job.
      #
      # Where Inno puts the files is the installer's business, and this step
      # does not assume it: it installs, then asks the disk where nvgt.exe is
      # and reports the answer in the log. If upstream changes the layout, the
      # log says so before the assertions do.
      #
      # Fetching through the release API rather than a hardcoded url means the
      # job follows whatever `latest` points at, the same as the pin script.
      - name: fetch nvgt
        shell: pwsh
        run: |
          # Unauthenticated calls to this endpoint are rate limited per runner
          # IP, and a limited call throws - which the step below then reports as
          # "nvgt never installed", a fact about github's rate limiter dressed as
          # a fact about the engine. The job's own token raises the ceiling.
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/samtupy/nvgt/releases/tags/latest' -Headers @{ 'User-Agent' = 'nvmidi-ci'; 'Authorization' = "Bearer ${{ github.token }}" }
          Write-Host "nvgt release: $($rel.tag_name) ($($rel.name))"
          Write-Host "assets: $(($rel.assets | ForEach-Object { $_.name }) -join ', ')"
          $asset = $rel.assets | Where-Object { $_.name -like '*.exe' } | Select-Object -First 1
          if (-not $asset) { throw "no .exe asset in release $($rel.tag_name)" }
          Write-Host "using $($asset.name) ($($asset.size) bytes)"
          $setup = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $setup -UseBasicParsing
          # A truncated download fails inside the installer with an error the
          # runner cannot read. Checked against the release's own byte count.
          $got = (Get-Item $setup).Length
          Write-Host "downloaded $got bytes to $setup"
          if ($got -ne $asset.size) { throw "download is $got bytes, release says $($asset.size)" }

          # The install itself. Start-Process with -Wait, because the installer
          # returns as soon as it has spawned its own child otherwise, and the
          # next line would look for nvgt.exe while it is still being written.
          #
          # /DIR is passed rather than left to the installer's default. Twice
          # now this step has guessed where the files land and been wrong: once
          # by treating the asset as an archive, once by searching four roots
          # and finding nothing. Where Inno would choose is its own business and
          # is not documented anywhere in the asset, so it is not asked - the
          # job says where to install and then the only open question is whether
          # the installer obeyed.
          $dir = Join-Path $env:RUNNER_TEMP 'nvgt'
          $log = Join-Path $env:RUNNER_TEMP 'nvgt-install.log'
          $p = Start-Process -FilePath $setup `
            -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES',"/DIR=$dir","/LOG=$log" `
            -Wait -PassThru
          Write-Host "installer exited $($p.ExitCode)"
          if (Test-Path $log) {
            Write-Host "=== installer log, the lines that say what it wrote ==="
            Get-Content $log | Where-Object { $_ -match 'Dest|-- File|Creating|Directory|Error' } | Write-Host
          } else {
            Write-Host "/LOG produced no file at $log"
          }
          if ($p.ExitCode -ne 0) { throw "nvgt installer failed with exit code $($p.ExitCode)" }

          # The installer was told where to go; this checks whether it went
          # there, and falls back to a search only to make a *surprise* visible
          # in the log rather than to guess silently.
          $exe = Join-Path $dir 'nvgt.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "not at the requested /DIR, so it went somewhere else. looking:"
            $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramData, $env:RUNNER_TEMP) |
              Where-Object { $_ -and (Test-Path $_) }
            $hit = $null
            foreach ($r in $roots) {
              $c = Get-ChildItem -Path $r -Recurse -Filter 'nvgt.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($c) { $hit = $c; break }
            }
            if (-not $hit) { throw "the installer exited 0, ignored /DIR=$dir, and no nvgt.exe exists under: $($roots -join ', ')" }
            $exe = $hit.FullName
          }
          $dir = Split-Path -Parent $exe
          Write-Host "nvgt installed at $exe"

          # nvgt searches lib/ next to itself, so the dll has to go there and
          # the working directory has to be the install root. Both are derived
          # from where the engine actually is, which is what NVGT_DIR carries.
          # The engine's own midi backend is moved out of the way, and the
          # reason is the runner and not the plugin.
          #
          # Windows on a machine with no sound device still reports one midi
          # out: device 0, named "Microsoft GS Wavetable Synth" after the
          # software synth's applet and backed by nothing. Opening it fails
          # with MMRESULT 1.
          #
          # An earlier version of this block renamed a file called nvgt_midi.*
          # beside nvgt.exe, on the theory that the engine's own midi plugin
          # was answering the backend lookup first. That was a guess and the
          # runner disproved it: the install ships no such file. The line was
          # "the engine shipped no nvgt_midi.* to move aside", the plugin was
          # registered as nvmidi all along, and the script's own log says so -
          # E2E_API_TEXT came back as "nvmidi/Windows MultiMedia". Nothing was
          # ever shadowed. The block is gone rather than kept as a no-op: a
          # rename that matches nothing reads, to the next person, as a fix
          # that is doing something.
          $engineMidi = Get-ChildItem -Path $dir -Recurse -Filter 'nvgt_midi.*' -ErrorAction SilentlyContinue
          if ($engineMidi) {
            Write-Host '::warning::the engine now ships a midi backend of its own, which earlier did not exist:'
            $engineMidi | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host 'nothing is renamed here - read the script log to see which backend actually answered'
          }

          "NVGT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The layout, kept to the two directories that matter. A recursive
          # listing of the install root buries that under a bundled jre, a
          # zipped sdk and every api-ms-win-* shim, which is a lot of log to
          # read past - and the thing being read for is exactly this: is the
          # engine at the root, and is there a lib next to it for the dll.
          Write-Host "engine root:"
          Get-ChildItem $dir -File | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "nvgt's own lib/ (the plugin goes here):"
          Get-ChildItem (Join-Path $dir 'lib') -File -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          # Not `nvgt -v`: this build rejects -v as an unknown option and exits
          # 1, which fails the step *after* a perfect install and buries the
          # real result under a dotted red line. What is wanted from this line
          # is only that the engine runs at all, so the check is the exit code
          # and the version is what the release calls itself.
          $v = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          Write-Host "engine exited $($v.ExitCode); release $($rel.tag_name), product 0.90.0"

      # What nvmidi_api_name's return actually is, measured inside the runner
      # rather than reasoned about from a desk. midi_api_name is the byte pair
      # midi_api_name_byte_count()/midi_api_name_byte(i); it returns the
      # literal "nvmidi/" prepended to a string that RtMidi's own object file
      # produces in the same process; if that string comes back as garbage the
      # pointer is the whole story, so the pointer is what is printed.
      #
      # Note non-null implies asIScriptEngine is usable, which rules out
      # ANGELSCRIPT_DLL_MANUAL_IMPORT having left the symbol null - the plugin
      # is dllexported and --kill-at deflates it, so nvgt resolves these on
      # its side, not ours.
      - name: build the plugin
        shell: cmd
        run: mingw32-make

      # Where did we put it. nvgt searches lib/ next to itself for a plugin
      # named by #pragma plugin, so nvmidi.dll has to be there and not in the
      # working directory. Reported because a plugin that is not found and a
      # plugin that is found and refuses produce the same three words.
      #
      # "next to itself" is the install root the previous step found, not the
      # checkout, so lib/ is created there.
      - name: install the plugin
        shell: pwsh
        run: |
          $lib = Join-Path $env:NVGT_DIR 'lib'
          New-Item -ItemType Directory -Force -Path $lib | Out-Null

          # The engine may ship a plugin under this same name, and the check
          # below is what says whether it did. It is written as a move rather
          # than a delete because the installer's file is not this job's to
          # throw away, and because whichever answer this run gets is worth
          # having in the log: the last two runs both printed `the engine
          # shipped no nvmidi.dll of its own`, so on this runner there is no
          # second module for `#pragma plugin nvmidi` to resolve to - the
          # collision this guard exists for is not happening today. The guard
          # stays because that is a fact about one installer build and not a
          # property of the engine.
          $shipped = Join-Path $lib 'nvmidi.dll'
          if (Test-Path $shipped) {
            $keep = Join-Path $env:NVGT_DIR 'lib\..\nvmidi.engine.dll.bak'
            Move-Item -Path $shipped -Destination $keep -Force
            Write-Host "the engine shipped its own nvmidi.dll; moved it to $keep"
          } else {
            Write-Host 'the engine shipped no nvmidi.dll of its own'
          }

          Copy-Item nvmidi.dll -Destination (Join-Path $lib 'nvmidi.dll') -Force
          $dll = Join-Path $lib 'nvmidi.dll'
          Write-Host "${dll}: $((Get-Item $dll).Length) bytes"
          # A zero byte file here would make the whole job meaningless and
          # silent - the loader says "failed to load plugin" for an empty file
          # exactly as it does for a missing dependency.
          if ((Get-Item $dll).Length -eq 0) { throw 'the built dll is empty' }
          Get-ChildItem $lib | Select-Object Name, Length

      # A loopback driver is what makes two windows processes meet over midi.
      # Neither of the two that exist ships with windows, so one is installed
      # here - and the job stops now, before anything is claimed, if that
      # cannot be done. A runner with no loopback is a runner where the
      # receiving half of this test has nothing to listen on, and a later
      # "nothing arrived" would be a fact about the runner reported as a fact
      # about the plugin.
      #
      # LoopBe1 first: it is a plain installer, needs no reboot, and presents
      # its port immediately. loopMIDI is the fallback because its installer
      # is known to leave the driver unloaded until a user launches the
      # application, which a runner has no one to do.
      # Two engine facts, measured in the same run, before anything below
      # depends on them.
      #
      # The api name probe is the control for the byte protocol: it reads the
      # backend name and prints both the numbers and the text the script
      # rebuilt from them. The char_at probe is the control for the text half
      # of that, because the classification in e2e_winmm.nvgt needs the number
      # of a character inside a literal and the obvious two ways of getting it
      # do not work here.
      #
      # Neither line below is written into a file and read back later. Both
      # scripts use print(), whose output is the redirected stdout, so what
      # appears in this step's log is exactly what the engine emitted - there
      # is no encoding step in between that could turn the answer into
      # question marks and send the next hour after the wrong fault.
      - name: probe the engine (api name and string find)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Join-Path $env:NVGT_DIR 'nvgt.exe'
          foreach ($name in @('probe_api_name', 'char_at_probe', 'char_of_probe', 'char_of2_probe', 'winmm_open_probe')) {
            $src = Join-Path $env:GITHUB_WORKSPACE "scripts/windows/$name.nvgt"
            $log = Join-Path $env:GITHUB_WORKSPACE "$name.out"
            Write-Host "=== $name ==="
            if (-not (Test-Path $src)) { Write-Host "SILENT $src does not exist"; continue }
            $p = Start-Process -FilePath $exe -ArgumentList @($src) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            Write-Host "engine exited $($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log | Write-Host }
            # Get-Content -Raw on an empty file answers $null, and a method
            # call on $null kills the step - which is how the first probe
            # printed its answer and the second one never ran. A missing or
            # empty stderr is the normal case here, not an error.
            if (Test-Path "$log.err") {
              $err = Get-Content "$log.err" -Raw
              if ($err -and $err.Trim().Length -gt 0) { Write-Host '--- stderr ---'; Write-Host $err }
          }
            }
          }

      # The loopback device. Three attempts stood here before this one, and the
      # two that failed are worth keeping, because neither reason is obvious:
      #
      # Two vendor installers, LoopBe1 and loopMIDI: they download, they start,
      # they are still running long after their own timeouts, and no device ever
      # appears in the machine's list. An Inno setup put down by a service
      # session with no interactive desktop is the reading that covers both.
      #
      # A separate process loading our own driver dll and then waiting: this
      # cannot work, and not for a fixable reason. A winmm driver is loaded *in
      # process* by winmm, so the device it publishes is visible only to the
      # process that loaded it - a second process enumerates the machine through
      # its own winmm and sees the synth alone. That is why the fetching step
      # that used to stand here is gone, and why the driver is staged here and
      # loaded by the listener rather than by this step: the driver and the
      # listener have to be one process.
      #
      # The file comes from the build job as an artifact and not from a release,
      # which is also why nothing is fetched from a url that can disappear.
      - name: stage the loopback driver
        shell: pwsh
        run: |
          # Its own directory, and deliberately not the one the plugin lives in.
          # Both files are now called nvmidi.dll, so staging the driver into the
          # plugin's directory - which is what 'nvmidi' under RUNNER_TEMP is,
          # and what this step did until the names collided - would put an
          # 80 KB driver over the real plugin and every later step would then be
          # measuring the wrong library. The name has to be nvmidi.dll now: a
          # winmm driver registers its own path in the registry and winmm loads
          # that second image in process, so two names would mean two images of
          # the same driver and OpenDriver answering the driver's own call with
          # HDRVR(-1).
          $dir = Join-Path $env:RUNNER_TEMP 'loopback'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $out = Join-Path $dir 'nvmidi.dll'
          $src = Join-Path $env:GITHUB_WORKSPACE 'tools\winmm_loopback\nvmidi.dll'
          if (-not (Test-Path $src)) {
            Write-Host "::error::the driver was not built, so there is nothing for the listener to load. Nothing below here can be concluded about midi."
            # No LOOPBACK_DLL is exported either, and the listener step is
            # gated on PORT_NAME, which this failure also prevents. The steps
            # after it therefore never run to read an empty variable as a
            # verdict.
            exit 1
          }
          Copy-Item $src $out -Force
          # The driver writes its status beside itself and not into the temp
          # directory root, so a status left by an earlier run cannot be read by
          # mistake.
          $status = "$out.status"
          if (Test-Path $status) { Remove-Item $status -Force }
          "LOOPBACK_DLL=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "driver staged: $((Get-Item $out).Length) bytes at $out"


      # What the listener is going to be measuring against, learned before it
      # measures. The listener opens a midi *input* and asserts the bytes it
      # hears came from the plugin; without a loopback driver there is no
      # input side for those bytes to arrive on, and that is a fact about the
      # runner. Establishing it here means the verdict steps can say "the
      # runner has no receiving port" instead of reporting a plugin bug for a
      # missing driver.
      - name: can this runner receive midi at all
        shell: pwsh
        run: |
          Write-Host "=== midi inputs windows reports ==="
          $ins = Get-CimInstance Win32_PnPEntity -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'midi|loop' }
          if ($ins) { $ins | ForEach-Object { Write-Host "  $($_.Name)" } } else { Write-Host "  (none)" }
          Write-Host "a hardware input is not required: the loopback driver the earlier step staged supplies one in the listener's own process. This list is printed so that a failure can be read against what the machine actually had."

      # The synthesiser every windows machine has. It is an output port owned by
      # the operating system rather than by a device, which makes it the one
      # thing available here that a plugin can genuinely be pointed at: if the
      # plugin opens it and every write is accepted, a real winmm port took a
      # real message. It cannot close the loop - a synth has no input side to
      # listen on - so it proves the send half only, and the job says so.
      - name: find the synth windows ships with
        shell: pwsh
        run: |
          $synth = Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'synth|gs wavetable' } | Select-Object -First 1
          if ($synth) { Write-Host "sound device: $($synth.Name)" }
          else { Write-Host "no wavetable synth in the sound device list" }
          # The name the plugin will see is winmm's, and the line to match on is
          # one of these. It goes into the environment under the name the script
          # reads, because a command line flag cannot get there: the engine's
          # option parser runs before the script does and refuses anything it
          # does not know (measured, run 36571447467: `Unknown option
          # specified: hint`, exit 78, empty stdout).
          "NVGT_E2E_HINT=gs wavetable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The sending half. The script plays a six note melody into whatever
      # port the plugin can find, and prints what it played. Run in the
      # background so the listener can be up while it plays - the listener
      # needs the port name out of the script's log, and the script needs a
      # listener that is already waiting.
      # The port list as a plain process sees it, which is not the list the
      # listener sees and is the only list the script can be given an index
      # into.
      #
      # The loopback driver is loaded in the listener, and a midi device
      # belongs to the process that owns its driver, so the port the listener
      # publishes is not in another process's output list. Measured: the
      # listener's process reported two outputs, the plugin's one. The script
      # under test enumerates its own - shorter - list and can only hand the
      # listener a name from it, and on this runner that name is the GS
      # Wavetable entry, which has no hardware behind it and answers MMRESULT
      # 1. So the index is measured here, in a process of the same shape as
      # the plugin's, and the listener turns it into a name off its own list.
      # The receiving half, started only once a port is known to exist. The
      # port name is passed as a substring because winmm's own naming is a
      # vendor string and the enumeration order is not guaranteed to match
      # between two processes.
      #
      # The listener loads the driver itself and not from the step above,
      # because a winmm driver lives in the process that loaded it. Loading it
      # here means this process owns the loopback device, the plugin in its own
      # process sees it as a normal port of the machine, and the message has
      # genuinely crossed a process boundary when the bytes land here. What the
      # listener saw before the plugin ran - the self test - is what makes the
      # silence or the arrival mean something.
      - name: listen on the plugin's port
        # Never skipped. With a port name this is the real listen - it opens
        # the plugin's port and waits for the melody. Without one the sender
        # failed before it could name anything, and there is still something
        # worth measuring: the driver loads or it does not, and the two device
        # lists print either way. This step used to be skipped in that case,
        # and the effect was that a failed open left the listener half entirely
        # unmeasured - measured on run 36572426554, where logs_listen.txt did
        # not exist and the verdict steps then had to guess which half was at
        # fault. `--inputs-only` keeps the load and the lists, and skips only
        # the wait.
        if: ${{ env.LOOPBACK_DLL != '' }}
        # A listener that fails is a finding, not a reason to stop measuring.
        # Without this, its non-zero exit skips every step below it - measured
        # on run 36573157386, where `build the plugin`, `play the melody` and
        # `read both logs` were absent from the step list and the verdict steps
        # then reported on a sender whose log had never been read. The verdict
        # step further down already reads LISTEN_EXIT and decides what the
        # listener's own failure means, so swallowing the exit code here loses
        # nothing and keeps the two halves independent.
        continue-on-error: true
        shell: pwsh
        run: |
          $indexArgs = @()
          if ($env:NVGT_PORT_INDEX) { $indexArgs = @('--index', $env:NVGT_PORT_INDEX) }
          # 5 seconds of waiting without a name: nothing will arrive, and the
          # self test that proves the route works needs about one.
          $seconds = if ($env:PORT_NAME -eq '') { '5' } else { '90' }
          $nameArg = @()
          if ($env:PORT_NAME -ne '') { $nameArg = @($env:PORT_NAME) }
          elseif ($env:NVGT_E2E_HINT -ne '') { $nameArg = @($env:NVGT_E2E_HINT) }
          python scripts\windows\e2e_listen.py @nameArg $seconds --driver "$env:LOOPBACK_DLL" @indexArgs 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\logs_listen.txt"
          Write-Host "listener exit code: $LASTEXITCODE"
          "LISTEN_EXIT=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Whether this process ended up with an input side is a fact about
          # this run and not about the runner, so it is published here rather
          # than assumed from a device list. The verdict steps read it to tell
          # "the runner has no loopback" apart from "the plugin never sent".
          $l = if (Test-Path "$env:GITHUB_WORKSPACE\logs_listen.txt") {
            Get-Content "$env:GITHUB_WORKSPACE\logs_listen.txt" -Raw } else { '' }
          $loaded = $l -match 'DRIVER_LOADED_PORTS'
          "LISTENER_POSSIBLE=$($loaded.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not $loaded) {
            Write-Host "::warning::the listener did not end up with a loopback input port, so nothing it says can be read as the plugin's silence. See the listener log above."
          }

      - name: count the midi outs in the plugin's process
        shell: pwsh
        # The list is the point; the exit code is incidental. This probe opens
        # no port and its reading is taken from stdout, so a non-zero exit
        # after the list printed must not stop the sender from running - which
        # is exactly what happened on run 36573765902, where this step exited 1
        # and the four steps below it were skipped.
        continue-on-error: true
        run: |
          $ports = python scripts\windows\winmm_ports.py
          $ports | Write-Host
          $json = python scripts\windows\winmm_ports.py --json
          "NVGT_PORTS=$json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: play the melody (script)
        shell: pwsh
        # The script path is built from GITHUB_WORKSPACE and not from %~dp0.
        # %~dp0 is the directory of the .cmd file github writes this step into,
        # which lives under RUNNER_TEMP, not in the checkout - so the step has
        # been asking nvgt for a script that does not exist, in every run since
        # it was written, and the only trace was one line in the runner's own
        # log: "error: Path not found: D:\a\_temp\scripts\...". Nothing in the
        # job read that line, so it read as "nvgt never started".
        #
        # The launch itself used to be `start /b`, which returns at once and
        # throws the process away. That is fine while the script only ends by
        # finishing its own prints, and wrong as soon as the engine dies: a
        # crash mid sentence leaves logs_e2e.txt ending wherever it got to, and
        # the wait step below then reports "the script finished without naming
        # a port" - the same words a clean early return produces. The two are
        # not the same finding. Start-Process with -PassThru keeps the handle,
        # the step waits for it, and the exit code goes in the log: 0 for a
        # clean end, and 0xC0000409 or 0xC0000005 for the stack overrun and the
        # access violation this work has already met. The wait step reads it.
        run: |
          $exe = Join-Path $env:NVGT_DIR 'nvgt.exe'
          $src = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows\e2e_winmm.nvgt'
          $log = Join-Path $env:GITHUB_WORKSPACE 'logs_e2e.txt'
          # No arguments after the script: the hint travels in the environment
          # (NVGT_E2E_HINT, set by the synth step) because the engine's option
          # parser rejects an unknown flag before it ever reads the script.
          $p = Start-Process -FilePath $exe `
            -ArgumentList @($src) `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $code = -1
          if (-not $p.WaitForExit(180000)) {
            Write-Host "the script was still running after three minutes; killing it"
            try { $p.Kill() } catch {}
            $code = -2
          } else {
            $code = $p.ExitCode
          }
          # Signed and unsigned, because the crash codes read as negative ints.
          $hex = ('0x{0:X8}' -f ($code -band 0xFFFFFFFF))
          Write-Host "nvgt exited $code ($hex)"
          # When it did, not only that it did. Measured on run 36600825015:
          # the exit was 0xC0000005 and the step that read the log spent its
          # full sixty seconds waiting first, so the log was read exactly 60.7
          # seconds after the launch - the 60 was the reader's budget for a
          # script that was already dead, and the crash had happened at some
          # unrecorded moment inside it. A duration next to a crash code is
          # what tells "it died at startup, before printing" from "it ran the
          # melody and fell over at the end", and the two want opposite work.
          $elapsed = ((Get-Date) - $p.StartTime).TotalSeconds
          Write-Host ("nvgt ran for {0:N1}s before it exited" -f $elapsed)
          "E2E_RAN_SECONDS=$([math]::Round($elapsed,1))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "E2E_EXIT_CODE=$code"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "E2E_EXIT_HEX=$hex"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (Test-Path "$log.err") {
            $err = Get-Content "$log.err" -Raw
            if ($err -and $err.Trim().Length -gt 0) { Write-Host "stderr:"; Write-Host $err }
          }
          if (Test-Path $log) {
            $t = Get-Content $log -Raw
            if ($t -and $t.Trim().Length -gt 0) {
              # The last line, because a crash truncates the file wherever it
              # got to and that is exactly the position worth seeing.
              Write-Host "logs_e2e.txt ends with:"
              Write-Host (($t -split "`n" | Select-Object -Last 3) -join "`n")
            }
          }

          # --- where in the script the death happens ---------------------------
          #
          # Everything above says the process died at 0.3s with 0xC0000005 and
          # wrote nothing. That is one fact and it has three different causes -
          # the script does not compile, the plugin's registration crashes, or
          # the script runs and dies at some line - and each wants different
          # work. So ask the engine directly, here, rather than infer it from a
          # log that is empty for all three.
          #
          # Two scripts, not one. The first is the pragma and a main that
          # prints; if that dies too, no line of the real script is implicated,
          # because there is no line of the real script in it. The second turns
          # the question into a bisect: it announces each call before making it,
          # so the last announcement standing names the call that killed the
          # process, and the silence after it is between two known lines instead
          # of anywhere in six hundred.
          #
          # The engine's compile errors go to the step's own stdout rather than
          # to this redirect - measured, on the run this step was added for -
          # so a compile failure shows up here as a line the job log has been
          # carrying all along and nothing has read.
          $probeSrc = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows'
          foreach ($case in @('n_type', 'l_int', 'm_str', 'k_lit', 'c_handle', 'e2e_min', 'i_var', 'j_pragma', 'e2e_types', 'a_bare', 'b_decl', 'd_call', 'e_call', 'f_open', 'g_float')) {
            $p2src  = Join-Path $probeSrc "$case.nvgt"
            $p2log  = Join-Path $env:GITHUB_WORKSPACE "$case.log"
            $p2err  = "$p2log.err"
            if (-not (Test-Path $p2src)) { Write-Host "::warning::$case.nvgt is missing from the checkout"; continue }
            $p2 = Start-Process -FilePath $exe `
              -ArgumentList @($p2src) `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput $p2log -RedirectStandardError $p2err
            $c2 = -1
            if (-not $p2.WaitForExit(60000)) {
              try { $p2.Kill() } catch {}
              $c2 = -2
            } else {
              $c2 = $p2.ExitCode
            }
            $sec2 = ((Get-Date) - $p2.StartTime).TotalSeconds
            $out = ''
            if (Test-Path $p2log) { $out = (Get-Content $p2log -Raw); if ($null -eq $out) { $out = '' } }
            $err2 = ''
            if (Test-Path $p2err) { $err2 = (Get-Content $p2err -Raw); if ($null -eq $err2) { $err2 = '' } }
            Write-Host "--- $case ---"
            Write-Host ("exit {0} (0x{1:X8}) after {2:N1}s, stdout {3} bytes, stderr {4} bytes" -f $c2, ($c2 -band 0xFFFFFFFF), $sec2, $out.Length, $err2.Length)
            # A script that threw out of the engine and a script that returned
            # cleanly are allowed to look identical here: the runner reports
            # the exit code and the job reads 0 as a pass. winmm_open_probe has
            # not been seen in the log since the probe loop was reordered, and
            # the two candidates - silenced before its first call, or exited on
            # an exception nobody caught - are not distinguishable from the
            # exit code alone. What the engine printed is the difference, so it
            # is stated rather than left to be inferred from a buffer size.
            if ($c2 -eq 0 -and $out.Length -eq 0) { Write-Host "::warning::$case exited 0 and printed nothing at all, so this run cannot say whether it ran or was cut short" }
            # Printed verbatim and unfiltered on purpose. This is the one place
            # in the job where the engine speaks for itself, and the whole step
            # exists because that speech was being paraphrased by greps.
            # The engine's own compile diagnostics, lifted out of the
            # verbatim dump above. A reader of this job should not have to
            # open a fold and read 434 bytes to find which line it named.
            foreach ($ln in ($out -split "`n")) {
              if ($ln -match '^\s*(file|line|ERROR|INFO|Compilation)') { Write-Host ("  ENGINE: " + $ln.Trim()) }
            }
            if ($out.Trim().Length -gt 0) { Write-Host "stdout:"; Write-Host $out }
            if ($err2.Trim().Length -gt 0) { Write-Host "stderr:"; Write-Host $err2 }
          }
          # The expected sha is taken here, from git, and handed to the block
          # below through the environment. It is deliberately not read out of
          # the workspace: the question that block exists to answer is whether
          # the file on the runner is this commit's file, and a value lifted
          # from that same file cannot answer it. git rev-parse reads the
          # commit object, which the checkout fetched from GitHub, so it is
          # outside the thing being measured.
          # The engine's own stdout, unfiltered, for the script that has
          # been dying at load. It is the only file whose first byte would
          # be the plugin's, and the probes above never touch it. It has to
          # stand inside the step's own block: written one level out it
          # still parses and still runs, but the step ends early and the
          # output is discarded - which is how this block printed nothing
          # on the run it was added for, while every probe around it spoke.
          $realDump = Join-Path $env:GITHUB_WORKSPACE 'logs_e2e.txt'
          if (Test-Path $realDump) {
            $rd = Get-Content $realDump -Raw
            if ($null -eq $rd) { $rd = '' }
            Write-Host ("--- logs_e2e.txt: {0} bytes ---" -f (Get-Item $realDump).Length)
            if ($rd.Length -gt 0) { Write-Host $rd }
          }
          # The engine writes script compile diagnostics to the process's
          # stdout, and this step redirects stdout to logs_e2e.txt. So a script
          # that does not compile leaves a real file with a real parse error in
          # it, and that file is the evidence - a 0 byte read is the one answer
          # this pair cannot give. Both are stated as sizes rather than as a
          # presence test, because an absent file and a failed redirect read
          # the same in a fold and mean different things. n_type showed that
          # midi_input and midi_output are not types the engine knows, so this
          # is the line that says whether the real script hit that refusal or
          # something else.
          # Both branches are assigned before Write-Host sees them. The first
          # version of this line put the if expression inside the format
          # argument, where PowerShell parses a command position: it read
          # "if" as the name of a command, threw, and ended the step - on run
          # 36618429968 that cost this whole dump block, so the four lines
          # this edit exists to print were the ones it never reached. The
          # line below it is the one that worked, and this is why.
          $realErr = Join-Path $env:GITHUB_WORKSPACE 'logs_e2e.txt.err'
          $realErrBytes = -1
          if (Test-Path $realErr) { $realErrBytes = (Get-Item $realErr).Length }
          Write-Host ("--- logs_e2e.txt.err: {0} bytes ---" -f $realErrBytes)
          # One source per fact, and every branch named.
          #
          # Three runs printed 30039 bytes for a 29438 byte file. The blob in
          # this commit is 29438: the API answers it, the local file hashes to
          # the same, so the file the runner should have is not in doubt. That
          # makes 30039 a value no reading of a 29438 byte file can produce,
          # and the line was three format fields filled from one argument list,
          # so a shortfall in that list shows up as a number rather than as an
          # error. Guessing which field went wrong is what produced the wrong
          # number twice; a line with no format string at all cannot fail that
          # way. So there is no -f operator here, no comma argument list, and
          # no shared expression: each reading is taken, named, and printed on
          # its own line.
          #
          # The commit sha comes from the environment rather than from a file
          # read, so it is the one number in this block that cannot have come
          # from the filesystem, and the sha of the file is compared against it
          # in the job summary line that follows.
          $realSrc = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows\e2e_winmm.nvgt'
          # The expected value is taken here, from git, and not read out of
          # the file being measured. A number lifted from the file cannot
          # answer whether that file is this commit's file; git's own object
          # store can, because the checkout fetched it from GitHub and it is
          # outside everything this step is looking at.
          #
          # This line has to stand inside the same block as the comparison
          # that reads it. The first version sat at the step's top level, one
          # level out, where it parsed, ran, and was discarded - the step
          # printed its own export line and then said no value had been
          # handed to it. The comment four hundred lines up describes this
          # exact failure; it was written about $realDump and did not stop me
          # walking into it with $WANT_SHA.
          $wantSha = (git -C $env:GITHUB_WORKSPACE rev-parse "HEAD:scripts/windows/e2e_winmm.nvgt")
          if ($LASTEXITCODE -ne 0) { $wantSha = '' }
          Write-Host ("blob sha for the script at this commit: " + $wantSha)
          $env:WANT_SHA = $wantSha
          Write-Host ("commit under test: " + $env:GITHUB_SHA)
          Write-Host ("looking for the script at: " + $realSrc)
          if (Test-Path $realSrc) {
            $srcItem = Get-Item -LiteralPath $realSrc
            $realFileLen = $srcItem.Length
            $realSha = (Get-FileHash -LiteralPath $realSrc -Algorithm SHA256).Hash
            $realBytes = $null
            try { $realBytes = [System.IO.File]::ReadAllBytes($realSrc) } catch { Write-Host ("ReadAllBytes threw: " + $_.Exception.Message) }
            $realArrLen = -1
            if ($null -ne $realBytes) { $realArrLen = $realBytes.Length }
            $realLines = -1
            if ($null -ne $realBytes) {
              $realLines = 1
              foreach ($b in $realBytes) { if ($b -eq 10) { $realLines++ } }
            }
            # Get-Item, ReadAllBytes and the hash, each stated separately, so
            # that a disagreement between them is three numbers that differ
            # rather than one number that is wrong.
            Write-Host ("script Get-Item length: " + $realFileLen)
            Write-Host ("script ReadAllBytes length: " + $realArrLen)
            Write-Host ("script line count from those bytes: " + $realLines)
            Write-Host ("script sha256 full: " + $realSha)
            # git answers a blob sha, which is a git object hash and not a
            # sha256 of the bytes; comparing that number against the one above
            # would print "no" for a file that is byte for byte correct. So the
            # expected value is taken with the same tool that produced the
            # measured one - git hash-object over the same bytes, once from the
            # index Git checked out and once from the working tree file. Those
            # two are comparable, and they are also the pair that answers the
            # original question: is the file the engine compiles this commit's
            # file, or a leftover.
            $wantBlob = $env:WANT_SHA
            if ($null -eq $wantBlob) { $wantBlob = '' }
            if ($wantBlob -ne '') {
              Write-Host ("blob sha for this commit: " + $wantBlob)
              $realBlob = (git -C $env:GITHUB_WORKSPACE hash-object -- $realSrc)
              Write-Host ("blob sha of the file on the runner: " + $realBlob)
              if ($realBlob -eq $wantBlob) { Write-Host "SCRIPT_BLOB_MATCHES_COMMIT yes" }
              else { Write-Host "SCRIPT_BLOB_MATCHES_COMMIT no" }
              # And the same question asked of git's own object database, which
              # is the authority on what this commit's bytes are.
              $headBlob = (git -C $env:GITHUB_WORKSPACE rev-parse "HEAD:scripts/windows/e2e_winmm.nvgt")
              Write-Host ("blob sha in git for HEAD: " + $headBlob)
              if ($realBlob -eq $headBlob) { Write-Host "SCRIPT_BLOB_IS_HEADS_BLOB yes" }
              else { Write-Host "SCRIPT_BLOB_IS_HEADS_BLOB no" }
            } else {
              Write-Host "no expected blob was handed to this step, so this run cannot compare"
            }
            # The engine names files by path, so a run that compiled a stale
            # copy still reports a file. The sha above is what tells this run's
            # bytes apart from a leftover one, and it is taken on the runner for
            # that reason rather than quoted from the repository.
            $rs = [System.Text.Encoding]::UTF8.GetString($realBytes)
            $ls = $rs -split "`n"
            $decls = $ls | Select-String -Pattern '^\s*(midi_[a-z_]+)@?\s+[a-z_]+\s*(=[^=]|;)' -AllMatches
            foreach ($d in $decls) { Write-Host ("  decl: " + $d.Line.Trim()) }
          } else {
            Write-Host "the real script is not at $realSrc"
          }

      - name: report the port index the script enumerated
        shell: pwsh
        run: |
          # The half of the handshake the wait step below cannot do.
          #
          # The listener loads the driver, so the driver's port is in the
          # listener's process. The script is a separate process and its own
          # enumeration is the only one it can act on: measured, it reported
          # E2E_OUTPUT_PORTS 1 - the phantom GS Wavetable entry at index 0 -
          # while the listener's list had two entries. The index the script
          # chose is therefore read out of its own log and handed to the
          # listener, which translates it into a name it can open an input on.
          #
          # Read early and not after the process exits. Start-Process redirects
          # to a file and the file grows as the script runs, so the lines are
          # there while the melody is still being played, and waiting for the
          # exit would make this step as slow as the melody and buy nothing.
          $deadline = (Get-Date).AddSeconds(60)
          $index = $null
          $chosen = ''
          # $null and not '' is what Get-Content answers for a file that exists
          # and holds nothing, and -match against $null sets $Matches to $null
          # rather than failing - so the first read of a log the engine has not
          # written yet threw ParentContainsErrorRecordException on $Matches[1]
          # and ended the step before it had looked once. The whole job follows
          # this step, and the sender it was waiting for was still starting up,
          # so the ordering made the throw close to certain: measured, this is
          # how logs_e2e.txt ended up 0 bytes with nothing collected from
          # outside at all. Assigning the empty string first costs one line and
          # removes the only path by which a not-yet-written log can end a run.
          $t = ''
          while ((Get-Date) -lt $deadline) {
            if (Test-Path logs_e2e.txt) {
              $t = Get-Content logs_e2e.txt -Raw
              if ($null -eq $t) { $t = '' }
              if ($t -match 'E2E_CHOSEN\s+(.+)') { $chosen = $Matches[1].Trim() }
              if ($t -match 'E2E_OUTPUT_PORT\s+(\d+)\s+(.+?)\s*$') {
                # The last such line the script printed for the chosen name is
                # the index it will address. Matched by name and not by number
                # alone, because the script's own list and this file's reading
                # of it have to be about the same device for the translation in
                # the listener to mean anything.
                foreach ($m in [regex]::Matches($t, 'E2E_OUTPUT_PORT\s+(\d+)\s+([^\r\n]+)')) {
                  if ($chosen -ne '' -and $m.Groups[2].Value.Trim() -eq $chosen) {
                    $index = $m.Groups[1].Value
                  }
                }
              }
              if ($index -ne $null) { break }
              if ($t -match 'E2E_PORT\s+(.+)') { break }
              # The script is already over. Waiting the rest of the minute out
              # would only delay the logs; nothing further is coming. Measured
              # on run 36572426554: the engine ran to its own end within six
              # seconds, and this step still sat here for sixty before saying
              # no index was published.
              if ($t -match 'E2E_END') { break }
            }
            Start-Sleep -Milliseconds 250
          }
          if ($index -eq $null) {
            # Not a failure here. A machine with no midi out ends the script
            # before the list is printed, and the verdict steps decide whether
            # that was the runner or the plugin. Without an index the listener
            # falls back to matching the name, which is what every earlier run
            # did and is still worth watching.
            Write-Host '::warning::the script never published a port index; the listener will fall back to its own name list'
          } else {
            Write-Host "the script addresses index $index, which it names '$chosen'"
            "NVGT_PORT_INDEX=$index" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: wait for the script to name its port
        shell: pwsh
        run: |
          # Up to a minute. Longer than any plausible cold start of the engine
          # plus the plugin load, short enough that a hang is a failure and not
          # a timeout that eats the job's whole budget.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path logs_e2e.txt) {
              $t = Get-Content logs_e2e.txt -Raw
              if ($null -eq $t) { $t = '' }
              if ($t -match 'E2E_PORT\s+(.+)') {
                $name = $Matches[1].Trim()
                Write-Host "the script chose the port: $name"
                # The script writes this line *after* opening, so the port is
                # live by the time the listener reads it. The listener is
                # started against the same name, which is the whole handshake.
                "PORT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                exit 0
              }
              if ($t -match 'E2E_END') {
                # Not a failure of this step. A machine with no midi out at all
                # ends the script early and says why, and the verdict steps
                # below decide whether that is the runner's shape or the
                # plugin's bug. Failing here would abort the job before the
                # log that says which is ever read.
                Write-Host "the script finished without naming a port:"
                Write-Host $t
                Write-Host "nvgt exit was $env:E2E_EXIT_CODE ($env:E2E_EXIT_HEX)"
                Write-Host "::warning::no port was opened - the verdict steps decide whether that is the runner or the plugin"
                exit 0
              }
            }
            Start-Sleep -Milliseconds 250
          }
          # -Raw of an empty file pipes $null, not '', and Write-Host of $null
          # prints an empty line - harmless here, but the line still has to be
          # named so that the three reads above are visible as one pattern.
          Get-Content logs_e2e.txt -Raw | Write-Host
          Write-Host "::warning::the script never named a port within 60s; reading it as the script not reaching that line rather than as a hang"
          exit 0

      - name: read both logs
        shell: pwsh
        run: |
          Write-Host "=== the sender's own account ==="
          if (Test-Path logs_e2e.txt) {
            Get-Content logs_e2e.txt
          } else {
            # Not a missing file to shrug at. The script is launched with its
            # own stdout redirected into this very path, so an absent file
            # means the engine never opened it - the engine did not run.
            # Worth its own word, because a compile error is written to the
            # *step's* stdout and not into the redirect, so it is easy to
            # read a green-looking log and miss that the script never
            # compiled at all.
            Write-Host "::error::there is no sender log at all: the engine never opened the redirect, so it never ran the script"
            Write-Host "(no sender log)"
          }

          # The lines that say which port was played into and how much went out
          # are already in the file above, but they are buried in stdout that
          # github folds by default and interleaved with the engine's own
          # chatter, so a reader looking at a green run cannot see them without
          # opening the fold. Repeated here as notices, which github lifts to
          # the top of the job summary: a run that passes should say what it
          # passed against, not only that it did.
          #
          # These are notices and not assertions - the steps below decide - so a
          # missing line here cannot turn a real pass into a failure, and cannot
          # turn a real failure into a pass either.
          # Get-Content answers $null and not '' for a file that exists and is
          # empty, and [regex]::Matches($null, ...) throws - which is how this
          # step died on the last run, taking the sender's own evidence down
          # with it. This step exists to report what the sender wrote; a sender
          # that wrote nothing is the finding, not a reason to fail the report.
          # The size is stated because 0 bytes and a failed redirect look the
          # same in a fold and mean different things.
          $s = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($null -eq $s) { $s = '' }
          if ([string]::IsNullOrEmpty($s)) {
            $len = if (Test-Path logs_e2e.txt) { (Get-Item logs_e2e.txt).Length } else { -1 }
            Write-Host "::warning::the sender log is empty ($len bytes): the script produced no output at all"
            Write-Host "(nothing to report from the sender)"
          } else {
            foreach ($m in [regex]::Matches($s, 'E2E_(?:OUTPUT_PORTS|CHOSEN|OPENED|PORT|SENT|END)\s*[^\r\n]*')) {
              Write-Host "::notice::$($m.Value.Trim())"
            }
            $sent = [regex]::Matches($s, 'E2E_NOTE_SENT\s+\d+').Count
            if ($sent -gt 0) { Write-Host "::notice::the script placed $sent note(s) on its own clock" }
          }

          Write-Host "=== what was heard from outside ==="
          if (Test-Path logs_listen.txt) { Get-Content logs_listen.txt } else { Write-Host "(no listener log)" }

      # The assertions. Everything above produces evidence; this decides.
      #
      # The order matters. A plugin that never loaded makes every later line
      # absent, and reporting "no note heard" for that would send the reader
      # after the midi code when the problem is the load. So each check says
      # what it is and what its absence means.
      - name: did the plugin load
        if: always()
        shell: pwsh
        run: |
          # Get-Content answers $null for a file that exists and holds nothing, and
          # that $null reaches the regex below unchanged. Measured: run
          # 36600067002 threw "Value cannot be null. (Parameter 'input')" out
          # of [regex]::Match here and ended the step, so the reading never
          # happened. $null read as a string is the empty string, which is
          # what the rest of this step already expects.
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($null -eq $t) { $t = '' }

          if ($t -notmatch 'E2E_BEGIN') {
            Write-Host "::error::the script never started: nvgt did not run it at all"
            exit 1
          }
          if ($t -match 'failed to load plugin') {
            Write-Host "::error::nvgt refused to load nvmidi.dll - the load time dependencies are wrong"
            exit 1
          }
          if ($t -match 'E2E_OK LOADED') {
            Write-Host "::notice::the plugin loaded and registered"
          } elseif ($t -match 'E2E_API') {
            # The line the gate above was written for has never existed in the
            # script. Measured: grep of e2e_winmm.nvgt for 'E2E_OK LOADED' and
            # for 'E2E_RUNNING' returns nothing at all - neither string is in
            # the file - so this branch was unreachable and the gate below it
            # has never once been the reason a run stopped. The script does
            # answer the same question, in its own words: it prints E2E_API
            # right after asking the plugin for its api name, and the numbers
            # in that line are what the backend step decodes.
            #
            # Read as a match on that line rather than by adding a print to
            # the script. The script is the measurement and is left alone; a
            # marker added today would make the next run the first one whose
            # marker meant anything, while the api line has been arriving in
            # every log that had any output at all.
            Write-Host "::notice::the script reached its api-name line, so the plugin registered and answered"
          } else {
            Write-Host "::error::the plugin did not register: the log holds no line where the script asked for the api name"
            exit 1
          }

      - name: is the backend a real one
        if: always()
        shell: pwsh
        run: |
          # Get-Content answers $null for a file that exists and holds nothing, and
          # that $null reaches the regex below unchanged. Measured: run
          # 36600067002 threw "Value cannot be null. (Parameter 'input')" out
          # of [regex]::Match here and ended the step, so the reading never
          # happened. $null read as a string is the empty string, which is
          # what the rest of this step already expects.
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($null -eq $t) { $t = '' }

          # The backend name is decoded here, from the numbers the script
          # printed, rather than read out of the text it rebuilt.
          #
          # This is not belt and braces. The text has been wrong on this runner
          # twice - once as the decimal digits of every byte, once as 25
          # question marks - and the numbers underneath it were right both
          # times. A verdict taken from the rebuilt text therefore reads a
          # translation fault as a plugin fault, which is what it did: two runs
          # were spent on a plugin that was working, reporting it as the wrong
          # backend. Decoding here puts the engine, AngelScript's string
          # constructors and every helper in this repository out of the path
          # between the bytes and the decision.
          $m = [regex]::Match($t, 'E2E_API_NUMBERS ([0-9,]+)')
          if (-not $m.Success) {
            Write-Host "::error::the script printed no E2E_API_NUMBERS line, so the backend name was never measured. Nothing below this step can conclude anything about the build."
            exit 1
          }
          $api = -join ($m.Groups[1].Value.Split(',') | ForEach-Object { [char][int]$_ })
          Write-Host "backend, decoded from the bytes: '$api'"

          # The script also asks the same question of its own strings, with
          # find() on the text it rebuilt, and prints the answers. That line is
          # read here and reported, but it is not a gate: find() on this engine
          # has answered wrongly for one-character arguments (probed, twice),
          # so a negative from it is a fact about the search and not about the
          # name. The verdict below is taken from the numbers and from nothing
          # else.
          $findW = [regex]::Match($t, 'E2E_API_FIND_WINDOWS (-?[0-9]+)')
          if ($findW.Success) { Write-Host "the script's own find('Windows') in its rebuilt text: $($findW.Groups[1].Value)" }

          # The released artefact is built with the dummy backend on linux, and
          # a dummy build passes every structural check in this job while
          # opening no port and delivering no byte. That is the failure this
          # job exists to catch, so it is fatal and not a warning.
          if ($api -match 'Dummy') {
            Write-Host "::error::the plugin was built with the dummy backend: it opens no port and sends nothing"
            exit 1
          }
          if ($api -notmatch 'Windows') {
            Write-Host "::error::the backend is '$api' and this job only makes sense against winmm: it exercises the windows midi api and its port list"
            exit 1
          }
          Write-Host "::notice::backend: $api"
          "BACKEND_NAME=$api" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: did a note actually leave the process
        if: always()
        shell: pwsh
        run: |
          # Get-Content answers $null for a file that exists and holds nothing, and
          # that $null reaches the regex below unchanged. Measured: run
          # 36600067002 threw "Value cannot be null. (Parameter 'input')" out
          # of [regex]::Match here and ended the step, so the reading never
          # happened. $null read as a string is the empty string, which is
          # what the rest of this step already expects.
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($null -eq $t) { $t = '' }

          if ($t -match 'E2E_NO_BUS') {
            Write-Host "::error::this runner has no midi output port at all, so nothing could be played into anything. The plugin was never exercised."
            exit 1
          }
          $heard = @()
          if (Test-Path logs_listen.txt) {
            $heard = Select-String -Path logs_listen.txt -Pattern '^HEARD ' | ForEach-Object { $_.Line }
          }
          $l = if (Test-Path logs_listen.txt) { Get-Content logs_listen.txt -Raw } else { '' }
          if ($l -match 'SELFTEST_FAILED') {
            Write-Host "::error::the loopback driver did not return the bytes it was given, so the midi route itself is dead. Nothing about the plugin can be concluded from this run."
            exit 1
          }
          if ($heard.Count -gt 0) {
            Write-Host "::notice::heard $($heard.Count) message(s) from outside the plugin's process"
            exit 0
          }

          # Nothing was heard outside. Two very different things look like
          # this, and the job has already measured which one it is: a listener
          # that could not run because the runner has no midi input device, or
          # a listener that ran and stayed silent.
          #
          # In the first case the evidence is the sender's own account and
          # nothing more. That is a weaker claim than "another process heard
          # it", and it is reported as the weaker claim rather than dressed up
          # as the strong one: what it establishes is that a real winmm port -
          # the synth windows ships with - was opened and every write to it was
          # accepted. A winmm call that a driver rejects returns an error, so a
          # silent rejection is not a way this can pass.
          $canListen = $env:LISTENER_POSSIBLE -eq 'true'
          if (-not $canListen -or $env:PORT_NAME -eq '') {
            if ($t -match 'E2E_SENT sequence') {
              Write-Host "::warning::the listener never got a loopback input port in its own process, so no second process could listen. Send half only: the plugin opened a real winmm port, wrote every message of the melody and the calls were accepted. Cross process delivery was NOT verified in this run."
              if ($t -match 'E2E_OUTPUT_PORTS (\d+)') {
                Write-Host "::notice::ports present: $($Matches[1]); backend: $env:BACKEND_NAME"
              }
              exit 0
            }
            Write-Host "::error::nothing was heard and the script itself never claimed E2E_SENT, so the send half is not established either"
            exit 1
          }
          Write-Host "::error::the listener held a loopback input port in its own process and the plugin opened a port and wrote into it, yet not one message arrived. The message did not survive the process boundary."
          exit 1

      # The comparison the whole job is for. The sender's log says which notes
      # it played in which order; the listener's log says which notes arrived
      # in which order. Matching them on (note, velocity) rather than on count
      # is what makes a stale buffer or a replayed queue fail - both produce
      # the right number of messages.
      - name: did the notes arrive in order
        if: always()
        shell: pwsh
        run: |
          $sent = @()
          if (Test-Path logs_e2e.txt) {
            $sent = Select-String -Path logs_e2e.txt -Pattern '^E2E_NOTE_SENT \d+ (\d+) (\d+)' |
              ForEach-Object { "$($_.Matches[0].Groups[1].Value):$($_.Matches[0].Groups[2].Value)" }
          }
          if ($sent.Count -eq 0) {
            Write-Host "::error::the script reported playing no notes at all"
            exit 1
          }
          $heardNotes = @()
          if (Test-Path logs_listen.txt) {
            $heardNotes = Select-String -Path logs_listen.txt -Pattern '^HEARD [\d.]+ note_on ch0 (\d+) (\d+)' |
              ForEach-Object { "$($_.Matches[0].Groups[1].Value):$($_.Matches[0].Groups[2].Value)" }
          }
          Write-Host "played: $($sent -join ' ')"
          Write-Host "heard : $($heardNotes -join ' ')"
          # No listener means no arrival log to compare against, and comparing
          # a log to nothing is not a verdict. The step above said why the
          # listener did not run; this one says so in one line and stops rather
          # than reporting a mismatch it cannot see.
          if ($heardNotes.Count -eq 0) {
            Write-Host "::warning::nothing was collected from outside the plugin's process, so the notes cannot be matched against an arrival log. The order and the bytes on the wire are unverified here."
            exit 0
          }
          # Order, not set membership: the melody's second half repeats its
          # first half an octave down, so a set comparison would accept a
          # scrambled run.
          $i = 0
          foreach ($n in $sent) {
            if ($i -ge $heardNotes.Count) {
              Write-Host "::error::the melody stops after $i note(s) from outside: '$n' and everything after it never arrived"
              exit 1
            }
            if ($heardNotes[$i] -ne $n) {
              Write-Host "::error::note $i left the process as '$n' and arrived as '$($heardNotes[$i])' - the bytes on the wire are not the bytes that were sent"
              exit 1
            }
            $i++
          }
          Write-Host "::notice::all $($sent.Count) notes of the melody arrived, in order, with the velocities they were sent with"

      # A script that does not compile prints no E2E_ marker at all: the only
      # output is "Compilation error: file: ... line: N", which goes to the
      # step's own stdout and not into the redirect the script was launched
      # with. Every symptom downstream is therefore "nvgt silently died", and
      # that class of bug cost several runs before it was found at the tail of
      # another step's output. It gets a step of its own so it is an error
      # annotation at the top of the job, not a line to scroll for.
      - name: did the script compile at all
        if: always()
        shell: pwsh
        run: |
          $logs = @()
          if (Test-Path logs_e2e.txt) { $logs += 'logs_e2e.txt' }
          if (Test-Path logs_listen.txt) { $logs += 'logs_listen.txt' }
          $bad = $false
          foreach ($l in $logs) {
            $hits = Select-String -Path $l -Pattern 'Compilation error' -SimpleMatch
            foreach ($h in $hits) {
              Write-Host "::error file=$l,line=$($h.LineNumber)::$($h.Line.Trim())"
              $bad = $true
            }
          }
          if ($bad) { throw "the nvgt script did not compile, so nothing it claims below was ever going to happen" }
          Write-Host "no compilation errors in $($logs -join ', ')"

      - name: the script's own verdict
        if: always()
        shell: pwsh
        run: |
          # Get-Content answers $null for a file that exists and holds nothing, and
          # that $null reaches the regex below unchanged. Measured: run
          # 36600067002 threw "Value cannot be null. (Parameter 'input')" out
          # of [regex]::Match here and ended the step, so the reading never
          # happened. $null read as a string is the empty string, which is
          # what the rest of this step already expects.
          $t = if (Test-Path logs_e2e.txt) { Get-Content logs_e2e.txt -Raw } else { '' }
          if ($null -eq $t) { $t = '' }

          if ($t -match 'E2E_FAIL (.+)') {
            Write-Host "::error::the script reported: $($Matches[1].Trim())"
          }
          if ($t -match 'E2E_END failures=(\d+)') {
            if ($Matches[1] -ne '0') {
              Write-Host "::error::the script finished with $($Matches[1]) failure(s)"
              exit 1
            }
            Write-Host "::notice::the script finished clean"
          } else {
            Write-Host "::warning::the script never reached E2E_END - it was cut short"
          }

      - name: every call the driver received
        if: always()
        shell: pwsh
        # The one measurement nobody has taken. Three changes have been made to
        # the driver's message dispatcher and each one was judged by the same
        # two downstream words - open-failed, and a port count of one - which
        # cannot tell a dispatcher that answers wrongly from a dispatcher that
        # is never entered. If midiOutGetNumDevs built its list from the
        # registry alone it must still have called the driver at least once, to
        # ask each entry what it was; if the list holds our entry and the count
        # is still one, then the ask happened and the answer was wrong, and the
        # trace says which answer.
        continue-on-error: true
        run: |
          # The earlier version of this step searched the runner temp directory
          # and the workspace and found nothing, and that told us nothing: the
          # trace is written beside the dll, and what "beside the dll" means
          # depends on where windows loaded the copy from. A driver dll dropped
          # on the loader path is loaded from there, so the file lands in that
          # directory - python's own, one level above the DLLs folder - and not
          # in the folder the step was looking at. The search now covers the
          # loader's directory and the staging directory, and it prints the
          # count rather than staying silent when it finds none, so the two
          # readings - absent file, and file present but empty - are separable.
          $dirs = @(
            (Split-Path (Get-Command python).Source -Parent),
            (Join-Path (Split-Path (Get-Command python).Source -Parent) 'DLLs'),
            "$env:RUNNER_TEMP\loopback",
            $env:GITHUB_WORKSPACE
          ) | Select-Object -Unique
          $found = 0
          foreach ($d in $dirs) {
            Write-Host "looking in $d"
            Get-ChildItem $d -Filter *.trace.txt -ErrorAction SilentlyContinue | ForEach-Object {
              $found++
              Write-Host "trace $($_.FullName) ($($_.Length) bytes):"
              Get-Content $_.FullName | ForEach-Object { Write-Host "  $_" }
            }
            Get-ChildItem $d -Filter nvmidi_trace_open_failed.txt -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "TRACE FILE COULD NOT BE OPENED: $($_.FullName)"
              Get-Content $_.FullName | ForEach-Object { Write-Host "  $_" }
            }
          }
          Write-Host "trace scan done, $found trace file(s) found"

      - name: keep both logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-logs
          path: |
            ${{ github.workspace }}/logs_e2e.txt
            ${{ github.workspace }}/logs_e2e.txt.err
            ${{ github.workspace }}/logs_listen.txt
            ${{ github.workspace }}/e2e_min.log
            ${{ github.workspace }}/e2e_min.log.err
            ${{ github.workspace }}/e2e_types.log
            ${{ github.workspace }}/e2e_types.log.err
            ${{ github.workspace }}/a_bare.log
            ${{ github.workspace }}/a_bare.log.err
            ${{ github.workspace }}/b_decl.log
            ${{ github.workspace }}/b_decl.log.err
            ${{ github.workspace }}/c_handle.log
            ${{ github.workspace }}/c_handle.log.err
            ${{ github.workspace }}/d_call.log
            ${{ github.workspace }}/d_call.log.err
            ${{ github.workspace }}/e_call.log
            ${{ github.workspace }}/e_call.log.err
            ${{ github.workspace }}/f_open.log
            ${{ github.workspace }}/f_open.log.err
            ${ github.workspace }/g_float.log
            ${ github.workspace }/g_float.log.err
            ${ github.workspace }/h_decl.log
            ${ github.workspace }/h_decl.log.err
          if-no-files-found: warn
          retention-days: 7
