name: build

# Builds the plugin for the two platforms the release publishes, and does
# nothing else. Each job produces exactly one file:
#
#   windows -> nvmidi.dll   built with MSVC by scripts/build_win_msvc.bat
#   linux   -> nvmidi.so    the dummy-backend build
#
# Why MSVC on windows, and not MinGW. nvgt.exe on windows is an MSVC build. A
# MinGW plugin carries libstdc++'s std::string layout while the engine carries
# MSVC's, and the two do not agree about where the characters and the size sit:
# measured 2026-10-01, a MinGW plugin received "nord" as size=0
# data=0x64726f6e, and midi_config::load() faulted on the misread pointer. The
# same source built with MSVC against the same engine receives the string
# intact. A MinGW dll must never be the published one.
#
# Why no engine is downloaded here. It used to be, to be turned into an import
# library through `dumpbin /exports` -> nvgt.def -> lib /def. There is nothing
# wrong with the step, and an earlier version of this comment claimed there was:
# the reason it is gone is that a file on the runner is slower and one more
# thing to keep in step than a line in the build script.
#
# The engine's as* symbols *are* needed at link time, and src/nvgt_plugin.h is
# why they need an alias. The header hands the plugin the engine's functions as
# pointers (nvgt_plugin.h:69-70, prepare_plugin() at :171-181 copies them out of
# nvgt_plugin_shared), so inside this build every one of those names is a
# pointer *variable* and not a function. third_party/angelscript was written
# against an engine that exports them as plain C functions and does not know
# that: scriptarray.cpp takes the address of two of them at :21-22 and calls a
# third by name at :274. Measure it and the linker says so itself - run
# 36908725123, five minutes after the import library was dropped:
#
#   scriptarray.obj : error LNK2001: unresolved external symbol asAllocMem
#     Hint: void * (__cdecl* asAllocMem)(unsigned __int64)
#           (?asAllocMem@@3P6APEAX_K@ZEA)
#
# "3P6A" in the mangled name is a pointer to a function, so the symbol MSVC
# wanted was the variable. scripts/build_win_msvc.bat supplies it with one
# `/alternatename:` alias per name, written into a generated header and forced
# in with /FI - no engine binary, no dumpbin, no .def, and the list sits in the
# same file as the compile line it belongs to.
#
# The dll links against winmm, ole32, setupapi and ksuser - the platform
# libraries RtMidi actually calls - plus those aliases, and nothing else from
# nvgt.
#
# Why the dummy backend on linux. Defining __LINUX_ALSA__ puts a
# "needed: libasound.so.2" entry into the library, and a machine without ALSA
# has the loader reject the whole library before a symbol is looked up; the
# engine then says only "failed to load plugin". The dummy build needs libc
# and libstdc++ only, so it loads anywhere. An ALSA build in a release is a
# trap, not a fallback.
#
# The workflow is reusable: release.yml calls it, so a release and an ordinary
# build compile the same way.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: build nvmidi.dll with MSVC
        shell: cmd
        run: scripts\build_win_msvc.bat

      - name: the dll needs no MinGW runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path nvmidi.dll)) { throw 'the MSVC build wrote no nvmidi.dll' }
          $bytes = [IO.File]::ReadAllBytes('nvmidi.dll')
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $nsections = [BitConverter]::ToUInt16($bytes, $pe + 6)
          $optsize = [BitConverter]::ToUInt16($bytes, $pe + 20)
          $opt = $pe + 24
          $magic = [BitConverter]::ToUInt16($bytes, $opt)
          $directories = $opt + $(if ($magic -eq 0x20b) { 112 } else { 96 })
          $sectionTable = $opt + $optsize
          $sections = for ($i = 0; $i -lt $nsections; $i++) {
            $o = $sectionTable + $i * 40
            [pscustomobject]@{
              Va     = [BitConverter]::ToUInt32($bytes, $o + 12)
              VSize  = [BitConverter]::ToUInt32($bytes, $o + 8)
              RawOff = [BitConverter]::ToUInt32($bytes, $o + 20)
            }
          }
          function Convert-RvaToOffset([uint32]$rva) {
            foreach ($s in $sections) {
              if ($rva -ge $s.Va -and $rva -lt ($s.Va + [Math]::Max($s.VSize, 1))) {
                return [int]($s.RawOff + ($rva - $s.Va))
              }
            }
            return -1
          }
          $importRva = [BitConverter]::ToUInt32($bytes, $directories + 8)
          if ($importRva -eq 0) { throw 'the dll has no import table' }
          $off = Convert-RvaToOffset $importRva
          $needs = @()
          while ($true) {
            $nameRva = [BitConverter]::ToUInt32($bytes, $off + 12)
            if ($nameRva -eq 0) { break }
            $nameOff = Convert-RvaToOffset $nameRva
            $end = $nameOff
            while ($bytes[$end] -ne 0) { $end++ }
            $needs += [Text.Encoding]::ASCII.GetString($bytes, $nameOff, $end - $nameOff)
            $off += 20
          }
          $needs | ForEach-Object { Write-Host "  needs: $_" }
          $mingw = $needs | Where-Object { $_ -match '^(libwinpthread|libstdc\+\+|libgcc)' }
          if ($mingw) {
            throw "the dll imports $($mingw -join ', '), a MinGW runtime windows does not have. Windows refuses such a dll whole and nvgt then says only 'failed to load plugin'. This must be an MSVC build."
          }
          $vc = $needs | Where-Object { $_ -match '^(vcruntime|msvcp)' }
          if ($vc) {
            Write-Host "::warning title=the dll needs the VC runtime::it imports $($vc -join ', '), so a user needs the Microsoft Visual C++ redistributable installed."
          }
          Write-Host 'the dll needs no MinGW runtime'

      - name: keep the dll
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-dll
          path: nvmidi.dll
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build nvmidi.so with the dummy backend
        run: make MIDI_BACKEND=dummy

      - name: the so needs nothing a stock machine lacks
        run: |
          set -euo pipefail
          test -s nvmidi.so
          ls -l nvmidi.so
          readelf -d nvmidi.so | grep -E 'NEEDED|SONAME' || true
          if readelf -d nvmidi.so | grep -q 'libasound'; then
            echo "::error::this library needs libasound.so.2, so the loader rejects it on a machine without ALSA and the engine reports only 'failed to load plugin'"
            exit 1
          fi

      - name: keep the so
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-so
          path: nvmidi.so
          if-no-files-found: error
