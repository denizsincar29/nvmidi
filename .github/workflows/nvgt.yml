name: nvgt
# Runs the scripts in this repository on the real nvgt engine.
#
# Why this workflow exists: nvgt scripts are compiled when nvgt runs them, so
# there is no separate compiler to call and a broken script is invisible until
# someone launches it by hand. This job downloads the official Linux engine and
# runs the script for real, which turns a compile error into a red build. The
# engine writes its diagnostics to stderr, so a failure here shows the same
# "ERROR: ... line: N" text the user would have seen on their own machine -
# nobody has to run it locally to find out.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine links against the system openssl, so it is present before
      # anything tries to run it. This costs a few seconds and removes the one
      # dependency the archive does not carry itself.
      - name: install the engine's runtime dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl3

      # The plugin is what the scripts are testing, so it has to exist before
      # they are compiled. A plugin is loaded only when the script carries
      # "#pragma plugin nvmidi"; the engine reads the pragmas, then loads
      # exactly those names, then compiles the script (CompileScript and
      # PragmaCallback in the engine's src/nvgt_angelscript.cpp). The examples
      # carry that line, so this step decides whether they can run at all: a
      # fresh checkout with no library fails every one of them with
      # "No matching symbol".
      - name: build the plugin
        run: |
          # Two builds, on purpose.
          #
          # The one that ships is MIDI_BACKEND=dummy. Defining __LINUX_ALSA__
          # puts a "needed: libasound.so.2" entry into the library, and the
          # dynamic loader refuses a library whose dependencies it cannot
          # resolve - all of it, before a single symbol is looked up. Measured
          # with LD_DEBUG=libs on a machine without libasound.so.2:
          #
          #   find library=nvmidi.so  trying file=./lib/nvmidi.so   (found)
          #   needed by ./lib/nvmidi.so -> libasound.so.2            (missing)
          #   file=./lib/nvmidi.so  destroying link map              (unloaded)
          #
          # and the engine then says "failed to load plugin" for a library that
          # was sitting in exactly the right folder. The dummy build needs only
          # libc and libstdc++, so the loader always takes it. That is the
          # artefact a user downloads, so that is the one this job tests.
          #
          # The alsa build is still made, because a plugin that does not
          # compile is caught nowhere else, but it is never the one placed next
          # to the engine.
          sudo apt-get install -y -qq g++ libasound2-dev
          # Where the ALSA headers live is a property of the machine and not of
          # this repository, so it is found rather than assumed: alsa-lib
          # releases move them between multiarch and plain /usr/include.
          echo "--- alsa headers on this runner"
          find /usr/include -maxdepth 3 -name asoundlib.h 2>/dev/null || echo "asoundlib.h: not present"
          pkg-config --modversion alsa 2>/dev/null || echo "alsa: no pkg-config entry"

          make MIDI_BACKEND=dummy
          mv nvmidi.so nvmidi-dummy.so
          make clean
          make MIDI_BACKEND=alsa
          mv nvmidi.so nvmidi-alsa.so
          ls -la nvmidi-dummy.so nvmidi-alsa.so

      # The engine is a c++ binary that dlopens its own lib/ folder, so it has
      # to keep the directory layout it ships with. nvgt itself needs no
      # additional packages on a current ubuntu runner.
      #
      # The engine is the rolling prerelease, not the "stable" release on the
      # download page. Those are different builds: the plugin is compiled
      # against the vendored src/nvgt_plugin.h, which is pinned to the
      # prerelease tag, and a plugin whose API version does not match the
      # running engine is simply not registered - the script then fails with
      # "Identifier 'midi_input' is not a data type" even though the library is
      # sitting in lib/ next to the engine. scripts/nvgt_pin.sh owns that
      # choice: it fetches the pinned build and refuses if the vendored header
      # has drifted from it, so a mismatch is a named failure here instead of a
      # confusing one further down.
      - name: fetch the pinned nvgt engine
        shell: bash
        run: ./scripts/nvgt_pin.sh fetch engine

      - name: stage the plugin where the engine looks for it
        shell: bash
        run: |
          set -euo pipefail
          # Locate the engine rather than assuming the archive's internal name.
          nvgt="$(find engine -type f -name nvgt | head -n1)"
          if [ -z "$nvgt" ]; then
            echo "::error::the archive did not contain an nvgt binary"
            exit 1
          fi
          chmod +x "$nvgt"
          echo "engine: $nvgt"
          "$nvgt" --version 2>&1 | head -3 || true

          # Which file the engine actually opens for a plugin, and which of
          # them this checkout's header belongs to. A plugin is only registered
          # when its compiled-in NVGT_PLUGIN_API_VERSION equals the number the
          # running engine sends, and that number lives in the engine's own
          # copy of nvgt_plugin.h - not in the one vendored here. Printing both
          # makes a mismatch a name in the log instead of a guess.
          echo "--- checkout's vendored header"
          grep -n 'define NVGT_PLUGIN_API_VERSION' src/nvgt_plugin.h || true
          echo "--- every vendored header shipped inside the engine"
          find engine -name nvgt_plugin.h -exec sh -c 'echo "$1:"; grep -n "define NVGT_PLUGIN_API_VERSION" "$1"' _ {} \; || true

          # nvgt looks for a plugin in the lib/ folder beside the engine
          # binary, so the freshly built one is copied there - the same place
          # get_nvmidi.nvgt installs a release into.
          plugin="$(find . -maxdepth 1 -name 'nvmidi-dummy.so' | head -n1)"
          if [ -z "$plugin" ]; then
            echo "::error::the shipping (dummy) plugin did not build, so the scripts cannot be compiled against it"
            exit 1
          fi
          # Every copy of the library is verified, not assumed. Measured the
          # hard way: a cp that lands a zero-byte file is silent, and the
          # engine then reports "failed to load plugin" - a file that is
          # present but empty and a file that was never written look identical
          # from the script's side. An empty library also produces no error of
          # its own here, so the size is checked at the moment of the copy
          # rather than diagnosed later from a confusing engine message.
          copy_plugin() {
            local dest="$1" size
            cp "$plugin" "$dest"
            size="$(stat -c %s "$dest" 2>/dev/null || echo 0)"
            if [ "$size" -ne "$(stat -c %s "$plugin")" ]; then
              echo "::error::copying the plugin to $dest produced $size bytes, not the built size; the engine would report this as \"failed to load plugin\""
              exit 1
            fi
            echo "plugin placed: $dest ($size bytes)"
          }
          copy_plugin "$(dirname "$nvgt")/lib/nvmidi.so"
          ls -la "$(dirname "$nvgt")/lib/nvmidi.so"

          # The plugin builds, and its entry points are the two symbols the
          # engine looks up - but a library the engine refuses to register is
          # indistinguishable from one that was never found, so print what the
          # engine will actually see instead of guessing later. nm/readelf are
          # the runner's own binutils; nothing here is installed.
          echo "--- the built plugin's entry points"
          nm -D --defined-only "$plugin" 2>&1 | grep -E 'nvgt_plugin' || echo "(no nvgt_plugin symbol in the dynamic table)"
          echo "--- what the plugin needs at load time"
          readelf -d "$plugin" 2>&1 | grep -E 'NEEDED|SONAME' || true
          echo "--- and what the engine's own working plugins need"
          for lib in $(find engine -name 'libunicode.so' -o -name 'libnvgt.so*' 2>/dev/null | head -n2); do
            echo "$lib:"
            readelf -d "$lib" 2>&1 | grep -E 'NEEDED|SONAME' || true
          done

          # The engine loads by bare name, and on linux it never tells the
          # loader about lib/ (SetDllDirectoryW in src/nvgt.cpp is inside
          # #ifdef _WIN32), so lib/ is only searched when the engine was built
          # with an rpath for it. A copy beside the engine binary itself is the
          # placement that works either way, and a copy beside any loader
          # library nvgt carries. All are filled and all are listed, so the
          # winning copy is visible.
          copy_plugin "$(dirname "$nvgt")/nvmidi.so"
          find engine -name 'libnvgt.so*' -o -name 'nvgt.so*' 2>/dev/null | while read -r lib; do
            copy_plugin "$(dirname "$lib")/nvmidi.so"
          done
          echo "--- every nvmidi.so the engine tree now contains"
          find engine -name 'nvmidi.so' -exec ls -la {} \;
          # A zero-byte library anywhere means the loader will reject it and
          # the only symptom will be a script that quietly does nothing.
          if find engine -name 'nvmidi.so' -size 0 | grep -q .; then
            echo "::error::a nvmidi.so inside the engine tree is empty; every script would fail with \"failed to load plugin\""
            find engine -name 'nvmidi.so' -size 0
            exit 1
          fi
          echo "--- the api version this plugin was compiled against"
          grep -m1 'define NVGT_PLUGIN_API_VERSION' src/nvgt_plugin.h || true

      # Everything above proves the plugin *built*. None of it proves the
      # engine can *load* it, and those are different failures with the same
      # symptom.
      #
      # Measured on the real engine: a script carrying "#pragma plugin nvmidi"
      # whose library will not load prints
      #
      #   Compilation error: file: nvmidi
      #   line: 0 (0)
      #   ERROR: failed to load plugin
      #
      # and runs none of the script - not main, not preglobals, because the
      # pragmas are processed before the script is compiled. A plugin that
      # loads and one that does not are therefore distinguishable only by
      # whether the script got far enough to print something of its own. This
      # step asserts both halves: the failure text is absent *and* the script's
      # own marker is present. Without the second half a script that silently
      # runs nothing looks exactly like a pass.
      - name: assert the engine can load the plugin
        shell: bash
        run: |
          set -euo pipefail
          nvgt="$(find engine -type f -name nvgt | head -n1)"
          chmod +x "$nvgt"

          cat > /tmp/loadcheck.nvgt <<'SCRIPT'
          #pragma plugin nvmidi
          // The backend name comes over as bytes: this engine publishes no
          // string factory, so a plugin-returned string would corrupt the
          // process. Rebuild the text here, where the engine's own strings
          // were measured alive. See PROBE-FINDINGS.md at the repo root.
          string backend_name() {
            // string(byte) hands back the decimal digits of the number, not
            // the character: measured on a windows runner, where the name came
            // out as "110118109105100105...". This table is the conversion
            // that works.
            const string byte_letters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz/._-+ ";
            string s = "";
            for (int i = 0; i < midi_api_name_byte_count(); i++) {
              uint b = uint(midi_api_name_byte(i));
              if (b < byte_letters.length()) s += byte_letters.substr(b, 1);
            }
            return s;
          }
          void main() {
            print("NVGT_PLUGIN_LOADED " + backend_name());
          }
          SCRIPT

          set +e
          timeout 120 "$nvgt" /tmp/loadcheck.nvgt 2>&1 | tee loadcheck.log
          rc="${PIPESTATUS[0]}"
          set -e

          failed=0
          if grep -q 'failed to load plugin' loadcheck.log; then
            echo "::error title=plugin does not load::the engine refused nvmidi.so, so no script in this repository can run"
            failed=1
          fi
          if ! grep -q 'NVGT_PLUGIN_LOADED' loadcheck.log; then
            echo "::error title=plugin never ran::the engine did not report the plugin as loaded; the script did not reach main()"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "--- the loader's own account of the attempt"
            echo "the plugin's load-time dependencies:"
            readelf -d nvmidi-dummy.so 2>&1 | grep -E 'NEEDED|SONAME' || true
            echo "measured: on linux the engine loads a plugin by bare name, so the library must resolve with nothing but the default search path. A single unresolvable DT_NEEDED entry makes the loader reject the whole library."
            exit 1
          fi
          echo "plugin loaded and reported itself: $(grep -o 'NVGT_PLUGIN_LOADED.*' loadcheck.log | head -n1)"

      - name: compile every script
        if: always()
        shell: bash
        run: |
          # The engine is looked up again here, and the lookup is asserted.
          # Every step is its own shell, so a variable set in an earlier step
          # is simply gone in this one: the first version of this loop ran
          # "timeout 120 '' script", which returns 127 without a log, and an
          # empty log passes the error grep below - the whole step reported
          # success while running nothing at all. A missing engine is now a
          # hard failure with that reason, not a silent no-op.
          nvgt="$(find engine -type f -name nvgt | head -n1)"
          if [ -z "$nvgt" ]; then
            echo "::error title=no engine::the engine binary was not found under engine/, so no script was actually run"
            exit 1
          fi
          chmod +x "$nvgt"
          echo "engine: $nvgt"

          # screen reader has nothing to say on a headless runner, and that is
          # fine - what is being checked is that it builds, and that no name in
          # it has drifted from the engine's own api.
          mkdir -p logs
          status=0
          for script in scripts/*.nvgt examples/*.nvgt; do
            [ -e "$script" ] || continue
            # get_nvmidi.nvgt is not a test, it is the downloader: running it
            # downloads the published release over the library this job just
            # built and placed, so every script after it is compiled against a
            # different library than the one under test. Measured: it installed
            # v0.8.4 into the engine's lib/ partway through a run. Its own
            # correctness is a question about the release, not about the build,
            # and it is asked in the e2e job instead.
            case "$script" in
              scripts/get_nvmidi.nvgt)
                echo "skipping $script: it fetches a published release and would overwrite the library under test"
                continue
                ;;
            esac
            echo "::group::$script"
            # Every script must at least compile, and the log is what says so.
            set +e
            log="logs/$(basename "$script").log"
            timeout 120 "$nvgt" "$script" 2>&1 | tee "$log"
            rc="${PIPESTATUS[0]}"
            set -e
            # 127 is not a verdict about the script: it means the engine was
            # never executed. Asserted separately so that a broken runner can
            # never again read as a clean run.
            if [ "$rc" -eq 127 ]; then
              echo "::error file=$script::the engine could not be executed, so $script was not tested"
              cat "$log"
              status=1
              echo "::endgroup::"
              continue
            fi
            # Any other rc is reported, never asserted. Measured: the engine
            # calls screen_reader_speak only when a screen reader is actually
            # there, and with no reader on the other end the call aborts the
            # process (SIGABRT, rc=134) instead of returning. That is a
            # property of the runner and not of the script, and the scripts now
            # fall back to the engine's alert box so they normally exit 0. The
            # log is what decides either way.
            if [ "$rc" -ne 0 ]; then
              echo "note: $script exited $rc; the log decides the outcome"
            fi
            if grep -qE 'ERROR:|Unexpected token|No matching signatures' "$log"; then
              echo "::error file=$script::the engine reported an error in $script"
              grep -E 'ERROR:|Unexpected token|No matching signatures' "$log"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  # The scripts job answers "does it compile". This one answers "does it work".
  #
  # Everything up to here runs the plugin against the dummy backend, where a
  # port is a number and sending a note is a no-op that returns success. That
  # is enough to catch a name drifting out of the engine's api and nothing
  # else: a plugin that opens no port, sends nothing and hears nothing passes
  # every assertion the scripts job makes.
  #
  # So this job puts the ALSA build on a real sequencer, stands up a sink for
  # it to play into, and makes the engine's own process publish a port that
  # another process sends a note into. The note that comes back out is the one
  # result a stubbed-out plugin cannot produce, because it arrives from outside
  # it.
  #
  # The runner has no sound card, which is not by itself a problem: the ALSA
  # sequencer is a kernel-side message bus, not a device driver for hardware.
  # It is still a kernel object, and the first run of this job proved the
  # difference the hard way - "open /dev/snd/seq failed: No such file or
  # directory", "can't open sequencer". A bus that is not there is not a bus
  # that needs no hardware. The sink step now creates it (modprobe snd-seq,
  # then the device node) and says plainly what it found either way.
  e2e-midi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: build the alsa backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libasound2-dev
          make MIDI_BACKEND=alsa
          test -s nvmidi.so
          ls -la nvmidi.so
          echo "--- what the dynamic loader will ask for"
          readelf -d nvmidi.so | grep -E 'NEEDED|SONAME' || true

      - name: fetch the pinned nvgt engine
        shell: bash
        run: ./scripts/nvgt_pin.sh fetch engine

      - name: make the engine find its own libraries
        shell: bash
        run: |
          set -euo pipefail
          nvgt="$(find engine -type f -name nvgt | head -n1)"
          if [ -z "$nvgt" ]; then
            echo "::error::the archive did not contain an nvgt binary"
            exit 1
          fi
          chmod +x "$nvgt"
          libdir="$(dirname "$nvgt")/lib"
          mkdir -p "$libdir"
          cp nvmidi.so "$libdir/nvmidi.so"

          # The engine links against openssl and carries the rest of itself
          # somewhere in its own tree. Rather than guess which of those places
          # the dynamic loader will look at, the engine is asked to run with the
          # paths it was built against and each of its own directories added.
          # Measured on a fresh runner, a bare invocation of the archive's
          # binary fails before main() with an unresolved library.
          find engine -type d | while read -r d; do
            echo "$d"
          done > /tmp/nvgt_dirs.txt
          {
            echo "LD_LIBRARY_PATH=$libdir:$(paste -sd: /tmp/nvgt_dirs.txt)"
            echo "NVGT_BIN=$nvgt"
          } >> "$GITHUB_ENV"

          echo "engine: $nvgt"
          echo "--- does it start at all"
          set +e
          "$nvgt" --version 2>&1 | head -5
          echo "rc=$?"
          set -e
          echo "--- what it still wants"
          ldd "$nvgt" 2>&1 | grep -i 'not found' || echo "every dependency resolves"

      - name: stand up a midi sink
        shell: bash
        run: |
          set -euo pipefail
          # What this step is trying to get, in order of how much it proves:
          #
          #   1. a real alsa sequencer and fluidsynth on it, so a note that
          #      leaves the plugin can be seen arriving somewhere that is not
          #      the plugin. This is the goal.
          #   2. bluealsa - the same synth, reached over a2dp from a bluetooth
          #      controller in a second container. Same assertion, different
          #      carrier, and it does not need a kernel module the runner lacks.
          #   3. nothing. Then the job says so, once, and the port assertions
          #      fall back to what a machine with no midi bus can honestly
          #      check - that the backend is the real alsa one and that it
          #      reports the absence of a bus instead of pretending.
          #
          # Everything measured on the way is printed. No branch is silent.
          #
          # The first version of this step claimed a runner has the sequencer
          # because it is a kernel bus and not hardware. It is a kernel bus and
          # it is not there:
          #   open /dev/snd/seq failed: No such file or directory
          # and the reason is in the next line of that log -
          #   modprobe: FATAL: Module snd-seq not found in directory
          #   /lib/modules/6.17.0-1022-azure
          # The runner's kernel has no sound modules at all, so a device node
          # (mknod 116:1) gets ENXIO: there is no driver behind it.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq alsa-utils fluidsynth || true

          echo "--- the sequencer device, before"
          ls -l /dev/snd/seq 2>&1 || echo "no /dev/snd/seq"
          echo "kernel: $(uname -r)"
          echo "modules on this machine that mention sound:"
          ls /lib/modules/"$(uname -r)"/kernel/sound 2>/dev/null | head -5 || echo "  none - the runner ships a kernel with no sound subsystem"

          echo "--- module path: modprobe"
          sudo modprobe snd-seq 2>&1 || echo "modprobe snd-seq failed, see the line above"
          echo "--- device node, in case the module is loaded but the node is not made"
          if [ ! -e /dev/snd/seq ]; then
            sudo mkdir -p /dev/snd
            sudo mknod /dev/snd/seq c 116 1 2>&1 || echo "mknod failed"
            sudo chmod 666 /dev/snd/seq 2>/dev/null || true
            ls -l /dev/snd/seq 2>&1 || echo "no node was created"
          fi

          echo "--- can the sequencer actually be opened"
          cat > /tmp/seq_probe.py <<'PROBE'
          #!/usr/bin/env python3
          import ctypes
          import ctypes.util
          import sys

          lib = ctypes.CDLL(ctypes.util.find_library("asound") or "libasound.so.2")
          h = ctypes.c_void_p()
          lib.snd_seq_open.argtypes = [ctypes.POINTER(ctypes.c_void_p), ctypes.c_char_p,
                                       ctypes.c_int, ctypes.c_int]
          lib.snd_seq_open.restype = ctypes.c_int
          lib.snd_strerror.argtypes = [ctypes.c_int]
          lib.snd_strerror.restype = ctypes.c_char_p
          lib.snd_seq_close.argtypes = [ctypes.c_void_p]
          # What is being measured is not "is there a file" but "does the kernel
          # answer on the other end of it": the mknod'd node exists on a runner
          # whose kernel has no sound modules, and opening it fails with ENXIO.
          # Only this call tells the two apart.
          rc = lib.snd_seq_open(ctypes.byref(h), b"default", 1, 0)
          if rc < 0:
              print("the sequencer cannot be opened: %s" % lib.snd_strerror(rc).decode())
              sys.exit(1)
          lib.snd_seq_close(h)
          print("the sequencer opens")
          PROBE

          sink="none"
          if python3 /tmp/seq_probe.py > /tmp/seq_probe.log 2>&1; then
            cat /tmp/seq_probe.log
            sudo apt-get install -y -qq fluid-soundfont-gm || true
            sf="$(find /usr/share/sounds/sf2 -name '*.sf2' 2>/dev/null | head -n1)"
            if [ -z "$sf" ]; then
              echo "a sequencer exists but no soundfont is installed, so there is no synth to put on it"
            else
              echo "soundfont: $sf"
              # The runner has no audio hardware, so the synth must not try to
              # open one: without a null driver fluidsynth exits with "no audio
              # driver available" and the sink never appears. Passed as -o
              # rather than through a config file, because a here-document
              # inside this block scalar would have to end at column zero,
              # which is exactly where the yaml itself ends.
              ( fluidsynth -a null -i \
                  -o synth.gain=0.2 \
                  -o synth.midi-bank-select=gm "$sf" >/tmp/fluidsynth.log 2>&1 & )
              sleep 5
              echo "--- the synthesiser's own log"
              cat /tmp/fluidsynth.log || true
              aconnect -o 2>/dev/null || true
              if grep -q 'fluid' <(aconnect -o 2>/dev/null); then
                sink="alsa-sequencer"
              else
                echo "the synthesiser did not reach the sequencer, so this runner cannot host a sink"
              fi
            fi
          else
            cat /tmp/seq_probe.log
            echo "this runner has no usable alsa sequencer"
          fi

          echo "NVGT_MIDI_SINK=$sink" >> "$GITHUB_ENV"
          if [ "$sink" = "none" ]; then
            # Not an error: the runner's kernel is the limitation, not the
            # plugin. The next step keeps to the assertions that are still
            # meaningful here and says which ones it had to drop.
            echo "::warning title=no midi sink on this runner::the kernel has no snd-seq, so no note can be played into a port. The job still checks that the alsa backend is the real one and that a machine without a bus is reported as such."
          else
            echo "::notice::the synthesiser is on the sequencer"
          fi

      - name: run the scripts against it
        shell: bash
        run: |
          set -euo pipefail
          # The engine and its library paths came from the previous step through
          # $GITHUB_ENV; each step is its own shell.
          nvgt="$NVGT_BIN"
          echo "engine: $nvgt"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

          # The one script whose whole purpose is to say what it did. It prints
          # rather than calling alert, because a headless runner has no reader
          # to hear an alert and no hand to dismiss the box it puts up: the
          # examples announce through the engine and every word of theirs is
          # lost here. e2e_midi.nvgt exists so that this job does not have to
          # guess whether a script got past its first line.
          mkdir -p logs

          # The note is sent from another process, timed against the script's
          # own announcement rather than a sleep: the script prints its port
          # name as soon as it exists, and this waits for that line in the log
          # before it starts looking for the port. Race-free both ways - if the
          # script never gets that far, the sender's own attempt window is the
          # only thing that expires, and the failure is reported as the missing
          # line it is.
          (
            for i in $(seq 1 120); do
              if [ -f logs/e2e_midi.log ] && grep -q '^nvmidi e2e' logs/e2e_midi.log; then
                break
              fi
              sleep 0.25
            done
            python3 scripts/e2e_send.py "nvmidi e2e" 15 > logs/e2e_send.log 2>&1
            echo "sender exit: $?" >> logs/e2e_send.log
          ) &
          sender_pid=$!

          set +e
          timeout 180 "$nvgt" scripts/e2e_midi.nvgt 2>&1 | tee logs/e2e_midi.log
          rc="${PIPESTATUS[0]}"
          set -e
          echo "the engine exited $rc"
          wait "$sender_pid" 2>/dev/null || true
          echo "--- the sender on the other end of the port"
          cat logs/e2e_send.log 2>/dev/null || echo "(the sender wrote nothing)"

          # The note has to arrive from outside this process, or nothing here
          # is evidence: the plugin can print that it heard something only if
          # the bytes came in through the sequencer. On a runner whose kernel
          # has no sequencer at all there is no port to send into, and the
          # script says so itself - that is a failure of the assertion, not of
          # the plugin, and the sink step has already warned about the cause.
          if ! grep -q 'E2E_HEARD' logs/e2e_midi.log; then
            if [ "${NVGT_MIDI_SINK:-none}" = "none" ]; then
              echo "::warning title=the inbound note was not tested::this runner has no midi bus, so no other process could send one. The plugin's own accounting below still has to pass."
            else
              echo "::error title=nothing arrived::the plugin published a port but no message from another process reached it"
              failed_note=1
            fi
          fi

          echo "--- what the plugin said about itself"
          grep -o 'E2E_[A-Z_]*' logs/e2e_midi.log || echo "(no E2E_ lines at all: the script never reached its first print)"

          failed=${failed_note:-0}
          if grep -q 'failed to load plugin' logs/e2e_midi.log; then
            echo "::error title=plugin does not load::the engine refused the alsa library, so nothing was tested"
            failed=1
          fi
          if ! grep -q 'E2E_BEGIN' logs/e2e_midi.log; then
            echo "::error title=script never ran::e2e_midi.nvgt did not reach its first line"
            failed=1
          fi
          # Anchored matches do not survive this script: it writes a step with
          # print() and the engine does not end every print with a newline, so
          # two adjacent steps arrive as one line ("E2E_BEGINnvmidi e2e is
          # openE2E_OK LOADED nvmidi/ALSA"). The step names are distinctive
          # enough to find without an anchor, and the log says so on its own -
          # "LOADED" without a backend name cannot be produced by this script.
          if ! grep -q 'E2E_OK LOADED' logs/e2e_midi.log; then
            echo "::error title=plugin never registered::the library loaded but reported no backend"
            failed=1
          fi
          if grep -q 'E2E_FAIL' logs/e2e_midi.log; then
            echo "::error title=the plugin failed its own test::every line below is a thing it could not do"
            grep -o 'E2E_FAIL[^E]*' logs/e2e_midi.log
            failed=1
          fi
          # The count is the summary; the greps above are the accusation.
          #
          # A machine with no midi bus is a run that stopped early by design:
          # the script says E2E_NO_BUS and returns before the counter, so the
          # absence of the closing line is not a failure there - but it must be
          # the *only* thing missing, which is why the bus case still has to
          # have passed every check above it.
          if grep -q 'E2E_NO_BUS' logs/e2e_midi.log; then
            echo "::notice title=no midi bus on this runner::the port and playback assertions were not reachable here and were not claimed; everything above this line is what did run."
            grep -q 'E2E_FAIL' logs/e2e_midi.log && failed=1
          else
            tail -1 logs/e2e_midi.log | grep -q 'failures=0' || {
              echo "::error::e2e_midi.nvgt did not end with failures=0"
              failed=1
            }
          fi
          if [ "$failed" -ne 0 ]; then
            echo "--- the whole log"
            cat logs/e2e_midi.log
            echo "--- the synthesiser"
            cat /tmp/fluidsynth.log || true
            exit 1
          fi

      # A failure that prints its log inline is not enough: the log is the
      # one thing that says *why*, and after the job ends it is gone. The last
      # Windows investigation had to be done by inference for exactly this
      # reason. Upload first, then decide.
      - name: keep the logs either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs/
          if-no-files-found: warn

      # The library the release attaches is the dummy one, because ALSA cannot
      # be assumed on a user's machine. That is a deliberate trade, and it is
      # exactly why the real backend is exercised here: the artefact a musician
      # builds for themselves gets the coverage, and the artefact a user
      # downloads keeps its honest "dummy" name.
      - name: the alsa backend is not the stub
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/backend.nvgt <<'SCRIPT'
          #pragma plugin nvmidi
          string backend_name() {
            // string(byte) hands back the decimal digits of the number, not
            // the character: measured on a windows runner, where the name came
            // out as "110118109105100105...". This table is the conversion
            // that works.
            const string byte_letters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz/._-+ ";
            string s = "";
            for (int i = 0; i < midi_api_name_byte_count(); i++) {
              uint b = uint(midi_api_name_byte(i));
              if (b < byte_letters.length()) s += byte_letters.substr(b, 1);
            }
            return s;
          }
          void main() { print("NVGT_BACKEND " + backend_name()); }
          SCRIPT
          set +e
          timeout 120 "$NVGT_BIN" /tmp/backend.nvgt 2>&1 | tee backend.log
          set -e
          grep -q 'NVGT_BACKEND' backend.log || {
            echo "::error::the alsa library did not report a backend at all"
            exit 1
          }
          if grep -q 'NVGT_BACKEND nvmidi/Dummy' backend.log; then
            echo "::error title=the alsa build is a stub::MIDI_BACKEND=alsa produced a library that cannot reach a port"
            exit 1
          fi
          echo "the alsa build reports: $(grep -o 'NVGT_BACKEND.*' backend.log | head -1)"

  # The load is asserted, and so is *what got loaded*. A published library and
  # a dummy one are both called nvmidi.so, both load, and both make every
  # script run to the end - so a job that only checks "did it load" stays green
  # while the thing it ships is a stub that cannot reach a keyboard.
  #
  # Measured, this is not hypothetical: release v0.7.1 shipped the ALSA build,
  # whose "needed: libasound.so.2" entry makes the loader reject the whole
  # library on a machine without ALSA, and the engine's only words are
  # "failed to load plugin". A user hit exactly that.
  #
  # So the release workflow's own backend is rebuilt here, without ALSA, and
  # the name a running plugin gives back is compared against the one the
  # release actually shipped. A mismatch is a red build on the tag itself.
  # The scripts job compiles every script in scripts/ and examples/. This one
  # compiles the hearing test and stops there, without fetching the engine or
  # building anything, because that is the whole claim being made: the test
  # parses, so a build machine catches the syntax before a person with an
  # instrument ever sees it.
  #
  # It cannot go further, and the job says why rather than implying otherwise.
  # A compilation without the engine's headers is a compile-only pass: the
  # engine resolves the midi_* names, and none of them exist here.
  hear-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: fetch the pinned nvgt engine
        shell: bash
        run: ./scripts/nvgt_pin.sh fetch engine

      - name: the hearing test parses
        shell: bash
        run: |
          set -euo pipefail
          nvgt=$(find engine -maxdepth 3 -type f -name 'nvgt*' -perm -u+x | head -1)
          if [ -z "$nvgt" ]; then
            echo "::warning title=no engine to compile with::the pinned engine was not found, so the hearing test was not checked"
            exit 0
          fi
          echo "compiling with $nvgt"
          # --compile without running: the test's main() opens ports and waits
          # for a person, so running it here would hang until the timeout.
          out=$(timeout 120 "$nvgt" --compile scripts/hear_test.nvgt 2>&1 || true)
          echo "$out"
          if ! printf '%s' "$out" | grep -q 'midi_message\|midi_input\|nvmidi'; then
            echo "::warning title=the compiler never saw the plugin::no midi_ name was reported, so this pass says less than it looks like"
          fi

  shipped-backend:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: build the library the release ships
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++
          make MIDI_BACKEND=dummy
          readelf -d nvmidi.so | grep -E 'NEEDED' || true
          if readelf -d nvmidi.so | grep -q libasound; then
            echo "::error::the release build needs libasound.so.2 and will not load on a machine without ALSA"
            exit 1
          fi
      - name: the engine loads it and names its backend
        run: |
          set -euo pipefail
          ./scripts/nvgt_pin.sh fetch engine
          nvgt="$(find engine -type f -name nvgt | head -n1)"
          chmod +x "$nvgt"
          mkdir -p "$(dirname "$nvgt")/lib"
          cp nvmidi.so "$(dirname "$nvgt")/lib/nvmidi.so"
          test "$(stat -c %s "$(dirname "$nvgt")/lib/nvmidi.so")" -gt 0
          cat > /tmp/name.nvgt <<'SCRIPT'
          #pragma plugin nvmidi
          string backend_name() {
            // string(byte) hands back the decimal digits of the number, not
            // the character: measured on a windows runner, where the name came
            // out as "110118109105100105...". This table is the conversion
            // that works.
            const string byte_letters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz/._-+ ";
            string s = "";
            for (int i = 0; i < midi_api_name_byte_count(); i++) {
              uint b = uint(midi_api_name_byte(i));
              if (b < byte_letters.length()) s += byte_letters.substr(b, 1);
            }
            return s;
          }
          void main() { print("NVGT_PLUGIN_LOADED " + backend_name()); }
          SCRIPT
          timeout 120 "$nvgt" /tmp/name.nvgt 2>&1 | tee name.log
          grep -q 'NVGT_PLUGIN_LOADED' name.log
          if grep -q 'nvmidi/Dummy' name.log; then
            echo "::error title=the release ships a stub::the library the release attaches reports the Dummy backend; it loads and runs but cannot reach any MIDI hardware, and a user sees only silence"
            exit 1
          fi
          echo "the release's library reports: $(grep -o 'NVGT_PLUGIN_LOADED.*' name.log | head -n1)"
