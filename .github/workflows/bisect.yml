name: bisect

# A bundle that answers one question: which commit broke the chord timing.
#
# Every static instrument in this repository has already been pointed at that
# question and none of them can see it - the fault is audible, it needs a real
# port, a real clock and a pair of ears. So this workflow does not try to
# isolate the commit by reasoning. It builds the instrument instead: one
# numbered folder per commit, each folder a self-contained nvgt program
# carrying both halves of that commit - the plugin and the engine that loads
# it - which is run by hand on the reporter's own machine until one folder
# misbehaves and the one before it does not. Folder N is the answer.
#
# WHAT IS IN A FOLDER.
#
#   N/nvgt.exe                 the engine itself, unpacked from the pinned
#                              release's Windows build
#   N/music_quickstart.exe     this commit's script, compiled by this commit's
#                              engine; run THIS one
#   N/lib/nvmidi.dll           the plugin, built from the commit's own source,
#                              in the engine's lib folder where it is looked
#                              for
#   N/lib/*.dll                the engine's own runtime libraries, as its
#                              distribution ships them
#   N/midi_config.json         the port selection (in 1, out 2), beside the exe
#   N/midi_config.txt          the same pair in the older text form
#   N/hash.txt                 commit, date, subject, and the sha256 of both
#                              binaries; this is how a folder is identified
#                              after the fact without trusting a folder name
#   N/README.txt               one paragraph, the same facts in prose
#
# The two config files are both written even though the engine needs only one.
# The repository moved from a text config to a JSON one at aac83ed (2026-10-03)
# and folders older than that commit have no JSON in them at all; the engine
# picks the form by content and not by extension, so writing both means every
# folder carries the reporter's requested ports whatever half of the window it
# falls in.
#
# WHY BOTH HALVES COME FROM THE SAME COMMIT.
#
# The plugin registers its types into the engine and the engine is the
# executable, so the pair is one program split across a process boundary. The
# ABI along that boundary moved inside this window. A plugin from thirty
# commits ago loaded by today's engine does not fail as "the old build" - it
# fails as "everything is broken", and that reading would name the wrong
# commit. Building both halves from each commit is what makes a folder's
# verdict mean the commit rather than the mismatch.
#
# WHY THE ENGINE IS DOWNLOADED, AND WHICH ASSET.
#
# The engine is upstream's and it is not in this tree for a runner to pick up:
# .gitignore excludes engine/ outright, because engine/ is where the local pin
# scratch download lands. So a checkout on a runner has no engine at all.
#
# Two ways of getting one were tried and both were wrong; they are recorded so
# they are not retried.
#
# Building it from source here is wrong: a local scons build reports "failed
# to load plugin" for a plugin this repository's own CI loads without
# complaint, so the local build is not the build the plugin is proven against.
#
# Asking scripts/nvgt_pin.sh is also wrong, and this is the subtle one: the
# script is correct for its own job but its job is the Linux host. It pulls
# the rolling release's .tar.gz, which is the Linux distribution - it has no
# nvgt.exe in it anywhere, and a job that assumed one died on "cannot stat
# share/nvgt.exe" after the plugin had built successfully.
#
# The asset that carries a Windows engine is the .exe build of the pinned
# release, which is published for exactly the platform this job needs. It is
# not itself the engine - "nvgt.exe" here is the launcher the release ships -
# so it is run to unpack its runtime tree and the tree is what gets used. One
# engine, not thirty: it is the same binary for every folder. What differs per
# folder is the script compiled into it, and that is the engine's own
# `--compile`.
#
# WHY THE WORKFLOW FORKS ITSELF.
#
# This file has to exist in every commit this job checks out, and it does not
# exist in any of them - it is being added now. Checking out an old commit
# would therefore delete the workflow that is running. So .github/ is copied to
# a directory outside the tree at the start and written back after every
# checkout. Nothing else is carried across: the rest of the tree is the commit,
# deliberately, because the commit is the thing being tested.
#
# WHY THERE IS NO `on: push`.
#
# It costs an engine download plus thirty plugin builds, which is minutes of
# runner time, and a bundle nobody is waiting for is runner time spent on
# nothing. It is dispatched by hand, once, by whoever wants the answer.
#
# The window is NOT anchored on HEAD, and that is deliberate. Adding this file
# moved HEAD, so a window measured from HEAD would measure from the commit that
# introduced the measuring - slide with every edit of this job and name folders
# that have nothing to do with the report. It is anchored on a commit hash, a
# fixed point this workflow cannot move. It defaults to the commit the reporter
# named as the far end of the window; moving the window is editing that one
# line, or passing `anchor` at dispatch. Folder 1 is the oldest.

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'commits, one folder each'
        type: number
        default: 30
      anchor:
        description: 'newest commit of the window (hash; the window ends here)'
        type: string
        default: 'e876520'

jobs:
  bundle:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The engine lands outside the tree, in a directory no checkout of this
      # repository ever touches, so it survives the loop below without being
      # carried around inside the working tree.
      #
      # It is downloaded, not taken from engine/ in this tree: .gitignore
      # excludes engine/ (it is the local pin scratch), so the checkout on a
      # runner has no engine/ at all. Any step that reads it dies on "cannot
      # find path ...engine\stub\..." the moment it runs anywhere but the
      # developer's own machine.
      #
      # The asset is the .exe and not the .tar.gz the pin script fetches: the
      # tar.gz is the Linux-only distribution and contains no nvgt.exe, which
      # is the failure this job already paid for once.
      #
      # The .exe is a packaging launcher, so it is run with the two switches
      # that keep it a launcher - no script, no console - and it unpacks its
      # engine tree into the directory it is run from. If it needs no script
      # it will simply exit; what is wanted from it is the unpacked tree, not
      # the program it would have started.
      - name: stage the engine and its runtime libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $share = "$env:RUNNER_TEMP/share"
          New-Item -ItemType Directory -Force -Path $share | Out-Null
          $exe = "$env:RUNNER_TEMP/nvgt_setup.exe"
          Invoke-WebRequest -Uri "https://github.com/samtupy/nvgt/releases/download/latest/nvgt_0.90.0_dev.exe" -OutFile $exe
          (Get-Item $exe).Length
          # The asset is an Inno Setup 6.7.0 installer, not a self-extracting
          # archive - the marker "Inno Setup Setup Data (6.7.0)" sits in its
          # tail. That is the answer to why two runs got nothing: an Inno
          # installer does not unpack into the directory it is run from, it
          # installs to %LOCALAPPDATA%\Programs\... through a wizard, and
          # "--quiet" is not one of its switches, so it was ignored and the
          # silent exit left the directory empty with no exit code. The
          # switches are Inno's own, and /DIR pins the destination so the
          # unpacked tree lands where this job expects to find it.
          # Start-Process, not the call operator: the call operator runs the
          # installer inside this shell, and Inno's /VERYSILENT starts the real
          # installer in a detached process and exits - so the shell, and the
          # step, moved on before the install had begun. -Wait blocks until
          # the installer is actually done.
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$share" -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          Write-Host "--- installer output ---"
          if (Test-Path "$env:RUNNER_TEMP/launcher.log") {
            Get-Content "$env:RUNNER_TEMP/launcher.log" | Select-Object -First 200
          } else {
            Write-Host "(installer wrote no output)"
          }
          Start-Sleep -Seconds 3
          Write-Host "--- what the launcher left ---"
          Get-ChildItem -Recurse -Depth 2 $share | Select-Object FullName, Length | Format-Table -AutoSize
          $nvgt = Get-ChildItem -Recurse -Filter 'nvgt.exe' $share -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nvgt) { throw "no nvgt.exe under $share after the install" }
          $lib = Get-ChildItem -Recurse -Directory -Filter 'lib_windows' $share | Select-Object -First 1
          if (-not $lib) { throw "no lib_windows/ under $share after the install" }

          # Flatten the launcher's own layout into the fixed one the loop
          # expects: the engine under lib/ with its runtime libraries beside
          # it, and nothing else at the root. The launcher nests things its
          # own way and the depth is not worth guessing at from here.
          $flat = "$env:RUNNER_TEMP/flat"
          New-Item -ItemType Directory -Force -Path "$flat/lib" | Out-Null
          Copy-Item -Force $nvgt.FullName "$flat/nvgt.exe"
          Copy-Item -Force "$($lib.FullName)/*.dll" "$flat/lib/"
          Copy-Item -Force "$($lib.FullName)/*" "$flat/lib/" -ErrorAction SilentlyContinue
          Write-Host "engine: $($nvgt.FullName) $($nvgt.Length)"
          Write-Host "libs:   $($lib.FullName)"
          Get-ChildItem $flat, "$flat/lib" | Select-Object Name, Length | Format-Table -AutoSize

      - name: build one folder per commit
        shell: bash
        env:
          COUNT: ${{ inputs.count }}
          ANCHOR: ${{ inputs.anchor }}
        run: |
          set -euo pipefail
          count="${COUNT:-30}"
          anchor="${ANCHOR:-e876520}"

          # The one thing carried across every checkout. See the note at the top
          # of this file: an old commit has no bisect.yml in it, so without this
          # copy the running workflow would be deleting itself.
          rm -rf "$RUNNER_TEMP/wf"; cp -r .github "$RUNNER_TEMP/wf"

          mapfile -t refs < <(git log --format='%H' -n "$count" "$anchor" | tac)
          echo "window: ${#refs[@]} commits"
          echo "  folder 1    ${refs[0]}"
          echo "  folder $count ${refs[-1]}"

          rm -rf bundle
          n=0
          for ref in "${refs[@]}"; do
            n=$((n + 1))
            echo "::group::folder $n ${ref:0:7}"
            git checkout -q --force "$ref"
            cp -r "$RUNNER_TEMP/wf/." .github

            git log -1 --format='%h %ad %s' --date=short "$ref"

            # The plugin. Each commit's own recipe, because the recipe itself
            # moved inside this window - the shim file the MSVC link needs was
            # added partway through, and a recipe from today applied to an old
            # source tree would fail to link rather than reproduce the old
            # behaviour.
            scripts/build_win_msvc.bat || { echo "MSVC BUILD FAILED at $n"; exit 1; }
            [ -f nvmidi.dll ] || { echo "folder $n: no nvmidi.dll after its own build"; ls -l; exit 1; }

            # The folder is assembled first and the compile happens against it,
            # so what the folder will hold at run time is decided before the
            # compile rather than by it. The exe is copied in afterwards and the
            # folder is exactly the set of files it would have been had the
            # compile run from inside it.
            #
            # The plugin goes in lib/ and not beside the exe. That is where the
            # engine looks - this repository's CI stages it there and reports
            # "failed to load plugin" from anywhere else - and it is the
            # difference between a folder that can be run and one that cannot.
            dir="bundle/$n"
            mkdir -p "$dir/lib"
            cp "$RUNNER_TEMP/flat/nvgt.exe" "$dir/nvgt.exe"
            cp -r "$RUNNER_TEMP/flat/lib/." "$dir/lib/" 2>/dev/null || true
            cp nvmidi.dll "$dir/lib/nvmidi.dll"

            # The script, from the commit. midi.nvgt is the entry point every
            # example #includes, and it in turn #includes the constants and the
            # string helpers - the closure is three files at the root, not one.
            # A folder holding only midi.nvgt compiles until it reaches the
            # first of the other two and then dies with "unable to locate this
            # include", which is a fault in the harness and not in the commit.
            cp midi.nvgt "$dir/midi.nvgt"
            cp nvmidi_constants.nvgt "$dir/nvmidi_constants.nvgt"
            cp nvmidi_string.nvgt "$dir/nvmidi_string.nvgt"
            cp examples/music_quickstart.nvgt "$dir/music_quickstart.nvgt"

            # The port selection travels with the exe, not with the script:
            # nvgt resolves a relative path against the folder it runs in.
            #
            # Both forms are written, in every folder, with the same pair,
            # because the repository moved from one to the other inside this
            # window and a folder from either half has to carry a config the
            # engine it is paired with will read. The engine picks the form by
            # content, not by extension, so a folder holding both is not
            # ambiguous - it is two copies of one setting.
            printf 'in_port = 1\nout_port = 2\n' > "$dir/midi_config.txt"
            printf '{\n  "in_port": 1,\n  "out_port": 2\n}\n' > "$dir/midi_config.json"

            # The compile runs from the repository tree and not from inside the
            # folder, because the example reaches the entry point by a relative
            # path that only resolves from there - "../midi.nvgt" is a path in
            # the tree. The compiler is the staged engine, called by its own
            # path because it is run from the tree.
            #
            # The compile is a real load test, done without hardware: the
            # engine that just started is a Windows process, it dlopens the
            # plugin out of its lib/ the same way the reporter's copy will,
            # and the pragma in midi.nvgt asks it for this commit's types. A
            # plugin that cannot load into this engine therefore fails here,
            # in the log, named by commit, instead of producing an exe that
            # breaks on hardware and gets blamed on the wrong commit.
            cp nvmidi.dll "$RUNNER_TEMP/flat/lib/nvmidi.dll"
            "$RUNNER_TEMP/flat/nvgt.exe" --compile \
              examples/music_quickstart.nvgt music_quickstart.exe \
              || { echo "COMPILE FAILED at folder $n ($ref)"; exit 1; }
            [ -f music_quickstart.exe ] || { echo "folder $n: no exe"; ls -l; exit 1; }
            mv music_quickstart.exe "$dir/music_quickstart.exe"

            {
              echo "commit  $ref"
              git log -1 --format='date    %ad%nsubject %s' --date=short "$ref"
              echo "sha256  nvmidi.dll         $(sha256sum "$dir/lib/nvmidi.dll" | cut -d' ' -f1)"
              echo "sha256  music_quickstart.exe $(sha256sum "$dir/music_quickstart.exe" | cut -d' ' -f1)"
              echo "engine  engine/stub/nvgt_windows_upx.bin (UPX 5.21), unpacked"
              echo "sha256  nvgt.exe             $(sha256sum "$dir/nvgt.exe" | cut -d' ' -f1)"
            } > "$dir/hash.txt"

            {
              echo "Folder $n of $count in the chord-timing bisection."
              echo
              echo "Commit $ref ($(git log -1 --format='%h, %ad' --date=short "$ref"))."
              echo
              echo "Run music_quickstart.exe from THIS folder, not from anywhere"
              echo "else: it looks for nvmidi.dll in lib/ beside it and for the"
              echo "port config beside itself. MIDI in is port 1, out is port 2."
              echo "Play a held chord and listen to the release."
              echo
              echo "If it misbehaves, the commit that broke it is this one or the"
              echo "one after it - check hash.txt above it."
            } > "$dir/README.txt"

            # A file that staged at zero bytes looks exactly like a file that
            # staged correctly until the reporter runs it and it does nothing.
            # The sizes go in the log so a silent empty stage is visible here
            # instead of on the reporter's machine.
            ls -l "$dir" "$dir/lib"
            echo "::endgroup::"
          done

          # The loop leaves the tree on the oldest commit. Put it back where the
          # run started so anything the runner does next sees the repository it
          # was dispatched for. This is tried rather than required: the answer
          # is already built at this point and a failure to check out should not
          # throw the bundle away.
          git checkout -q --force "$GITHUB_SHA" || true
          cp -r "$RUNNER_TEMP/wf/." .github

          echo "folders: $(find bundle -maxdepth 1 -mindepth 1 -type d | wc -l)"
          echo "exes:    $(find bundle -maxdepth 2 -name 'music_quickstart.exe' | wc -l)"
          echo "dlls:    $(find bundle -mindepth 2 -maxdepth 3 -name 'nvmidi.dll' | wc -l)"
          find bundle -name nvmidi.dll -printf '%s %p\n' | sort -k2

      - name: name the bundle after the window it holds
        id: name
        shell: bash
        run: |
          set -euo pipefail
          first=$(head -1 bundle/1/hash.txt | awk '{print substr($2,1,7)}')
          last=$(head -1 bundle/$(find bundle -maxdepth 1 -mindepth 1 -type d | wc -l)/hash.txt | awk '{print substr($2,1,7)}')
          echo "artifact=nvmidi-bisect-${first}-to-${last}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: bundle
          if-no-files-found: error
          retention-days: 14
