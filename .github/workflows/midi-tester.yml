# Builds nvmidi-tester (tools/midi_tester): a fake MIDI keyboard that opens a
# virtual port and plays what is typed on stdin. One binary per platform, left
# as downloadable artifacts. A tag named tester-* also publishes them as a
# release, for developers who have no keyboard and no compiler.
name: midi-tester

on:
  push:
    branches: ['**']
    tags: ['tester-*']
  pull_request:
    paths:
      - 'tools/midi_tester/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: nvmidi-tester-linux
            file: nvmidi-tester
          - os: macos-latest
            name: nvmidi-tester-macos
            file: nvmidi-tester
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: build (unix)
        if: runner.os != 'Windows'
        working-directory: tools/midi_tester
        run: make

      - name: help runs
        working-directory: tools/midi_tester
        shell: bash
        run: ./${{ matrix.file }} -h

      # A machine with no MIDI system must fail with a readable message and a
      # non-zero exit, not crash. Runners have no ALSA sequencer or MIDI
      # driver, so either the tool starts and quits on EOF (exit 0), or it
      # reports an error (exit 1); a signal or abort (>=128) is the failure.
      - name: does not crash without a MIDI system
        working-directory: tools/midi_tester
        shell: bash
        run: |
          set +e
          ./${{ matrix.file }} < /dev/null
          rc=$?
          echo "exit code $rc"
          if [ "$rc" -ge 128 ]; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tools/midi_tester/${{ matrix.file }}
          if-no-files-found: error

  windows:
    # MSVC and not MinGW: the Windows MIDI Services API is C++/WinRT, which
    # only MSVC builds. The exe creates the virtual port itself on Windows 11
    # 25H2+, and falls back to a loopMIDI port everywhere else. The zip holds
    # the exe and Windows.Devices.Midi2.dll, which the exe loads from its own
    # folder when Windows does not carry the API itself.
    runs-on: windows-latest
    env:
      MIDI2_VERSION: 0.99.94-preview.12
      CPPWINRT_VERSION: 3.0.260520.1
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: get the NuGet packages
        shell: pwsh
        run: |
          nuget install Windows.Devices.Midi2 -Version $env:MIDI2_VERSION -Prerelease -OutputDirectory pkgs -NonInteractive
          nuget install Microsoft.Windows.CppWinRT -Version $env:CPPWINRT_VERSION -OutputDirectory pkgs -NonInteractive
          Get-ChildItem pkgs -Recurse -Include *.winmd,Windows.Devices.Midi2.dll,cppwinrt.exe | Select-Object -ExpandProperty FullName

      - name: generate the C++/WinRT projection
        shell: pwsh
        run: |
          $cppwinrt = (Get-ChildItem pkgs -Recurse -Filter cppwinrt.exe | Select-Object -First 1).FullName
          $winmd = (Get-ChildItem pkgs -Recurse -Filter Windows.Devices.Midi2.winmd | Select-Object -First 1).FullName
          & $cppwinrt -input $winmd -reference sdk -output tools/midi_tester/gen -verbose
          if ($LASTEXITCODE -ne 0) { throw "cppwinrt failed" }

      - name: what the projection step produced
        if: always()
        shell: pwsh
        run: |
          $lines = @()
          $lines += "winmd files:"
          $lines += (Get-ChildItem pkgs -Recurse -Include *.winmd | ForEach-Object { $_.FullName.Replace((Get-Location).Path,'') })
          $lines += "dll files:"
          $lines += (Get-ChildItem pkgs -Recurse -Include Windows.Devices.Midi2*.dll | ForEach-Object { $_.FullName.Replace((Get-Location).Path,'') })
          $lines += "gen headers:"
          $lines += (Get-ChildItem tools/midi_tester/gen -Recurse -Filter *Midi*.h -ErrorAction SilentlyContinue | Select-Object -First 15 | ForEach-Object { $_.FullName.Replace((Get-Location).Path,'') })
          $txt = ($lines -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Host "::notice title=inspect::$txt"

      # The compiler's complaints are copied into an error annotation, so they
      # can be read from the run's check without downloading the log.
      - name: build
        shell: pwsh
        working-directory: tools/midi_tester
        run: |
          $args = @('/nologo','/std:c++17','/O2','/EHsc','/MT','/W3','/DNVMIDI_WMS','/D__WINDOWS_MM__','/DNOMINMAX',
                    '/Igen','/I..\..\third_party\rtmidi',
                    'nvmidi_tester.cpp','wms_backend.cpp','..\..\third_party\rtmidi\RtMidi.cpp',
                    '/Fe:nvmidi-tester.exe','/link','windowsapp.lib','winmm.lib','advapi32.lib')
          $out = & cl.exe @args 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) {
            $errs = ($out | Where-Object { $_ -match 'error|fatal|LNK' } | Select-Object -First 12) -join "`n"
            if ($errs.Length -gt 3000) { $errs = $errs.Substring(0, 3000) }
            $errs = $errs.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=cl failed::$errs"
            exit 1
          }

      - name: package the exe with the API dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item tools/midi_tester/nvmidi-tester.exe out/
          $dll = Get-ChildItem pkgs -Recurse -Filter Windows.Devices.Midi2.dll | Where-Object { $_.FullName -match 'win-x64' } | Select-Object -First 1
          if (-not $dll) { throw "Windows.Devices.Midi2.dll for win-x64 not found in the package" }
          Copy-Item $dll.FullName out/
          Get-ChildItem out

      - name: help runs
        shell: pwsh
        working-directory: out
        run: ./nvmidi-tester.exe -h

      # A runner has no usable MIDI service. The tool has to say so in words
      # and exit by itself; a crash code is the failure.
      - name: no MIDI service gives a readable message
        shell: pwsh
        working-directory: out
        run: |
          "" | ./nvmidi-tester.exe
          Write-Host "exit code $LASTEXITCODE"
          if ($LASTEXITCODE -lt 0 -or $LASTEXITCODE -gt 127) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: nvmidi-tester-windows
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/tester-')
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: name the files by platform
        run: |
          mkdir out
          (cd dist/nvmidi-tester-windows && zip -q ../../out/nvmidi-tester-windows.zip nvmidi-tester.exe Windows.Devices.Midi2.dll)
          cp dist/nvmidi-tester-linux/nvmidi-tester out/nvmidi-tester-linux
          cp dist/nvmidi-tester-macos/nvmidi-tester out/nvmidi-tester-macos
          chmod +x out/nvmidi-tester-linux out/nvmidi-tester-macos
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
