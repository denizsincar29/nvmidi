name: release
# Cuts a GitHub Release carrying the built plugin when a version tag is pushed.
#
# The downloader in scripts/get_nvmidi.nvgt resolves the "latest" release and
# pulls the library out of it, so the asset names here are a contract, not a
# detail: they are nvmidi.dll and nvmidi.so, and they have to stay those.
#
# The tag is the version. v0.7.0 makes a release named v0.7.0 - there is no
# second place to write the number down, so it cannot drift from the tag.
#
# Both platforms are built, and each asset keeps the name the Makefile gives
# it: nvmidi.dll on windows, nvmidi.so on linux. A release that shipped only
# the dll quietly left linux users with nothing to download.
# The two jobs are independent, so they run in parallel; each one uploads its
# artifact and the release job then attaches both files.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        shell: cmd
        run: mingw32-make

      # The import table is the thing that decides whether this dll loads on
      # someone else's machine, and it is completely invisible in the file: a
      # dll that names a library the machine does not have is refused whole,
      # and nvgt then prints only
      #
      #     Compilation error: file: nvmidi
      #     line: 0 (0)
      #     ERROR: failed to load plugin
      #
      # Measured on the shipped v0.8.0 asset: its import table named
      # libwinpthread-1.dll, a MinGW library Windows does not have, and that
      # was the whole reason a user could not load the plugin. Nobody could
      # have seen it without opening the file.
      #
      # So the table is asserted here. The three kinds of entry a stock Windows
      # always has: KERNEL32.dll itself, the api-ms-win-crt-* runtime that ships
      # with the system, and the multimedia stack the backend talks to. Anything
      # else is a MinGW runtime library that followed the build in, and the
      # build fails rather than shipping it to a machine that lacks it.
      - name: assert the dll asks the system for nothing it does not have
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("nvmidi.dll")
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $sectionCount = [BitConverter]::ToUInt16($bytes, $pe + 6)
          $optSize = [BitConverter]::ToUInt16($bytes, $pe + 20)
          $opt = $pe + 24
          $magic = [BitConverter]::ToUInt16($bytes, $opt)
          $dataDir = if ($magic -eq 0x20b) { $opt + 112 } else { $opt + 96 }
          $sectionTable = $opt + $optSize

          $sections = @()
          for ($i = 0; $i -lt $sectionCount; $i++) {
            $o = $sectionTable + $i * 40
            $vsize = [BitConverter]::ToUInt32($bytes, $o + 8)
            $vaddr = [BitConverter]::ToUInt32($bytes, $o + 12)
            $rawSize = [BitConverter]::ToUInt32($bytes, $o + 16)
            $rawOff = [BitConverter]::ToUInt32($bytes, $o + 20)
            $sections += [pscustomobject]@{ Va = $vaddr; VSize = $vsize; RawOff = $rawOff; RawSize = $rawSize }
          }

          function RvaToOff([uint32]$rva) {
            foreach ($s in $sections) {
              if ($rva -ge $s.Va -and $rva -lt ($s.Va + [Math]::Max($s.VSize, 1))) {
                return [int]($s.RawOff + ($rva - $s.Va))
              }
            }
            return -1
          }

          $importRva = [BitConverter]::ToUInt32($bytes, $dataDir + 8)
          if ($importRva -eq 0) { Write-Error "the dll has no import table at all"; exit 1 }

          $allowed = @('KERNEL32.dll', 'WINMM.dll', 'ole32.dll', 'SETUPAPI.dll', 'ksuser.dll')
          $bad = @()
          $off = RvaToOff $importRva
          while ($true) {
            $nameRva = [BitConverter]::ToUInt32($bytes, $off + 12)
            if ($nameRva -eq 0) { break }
            $nameOff = RvaToOff $nameRva
            $end = $nameOff
            while ($bytes[$end] -ne 0) { $end++ }
            $name = [Text.Encoding]::ASCII.GetString($bytes, $nameOff, $end - $nameOff)
            Write-Host "  needs: $name"
            $ok = $false
            foreach ($a in $allowed) { if ($name -ieq $a) { $ok = $true } }
            if ($name -like 'api-ms-win-*') { $ok = $true }
            if ($name -like 'ext-ms-win-*') { $ok = $true }
            if (-not $ok) { $bad += $name }
            $off += 20
          }

          if ($bad.Count -gt 0) {
            Write-Host "::error::the dll imports $($bad -join ', '), which a machine without MinGW does not have. Windows refuses such a dll as a whole, and nvgt then reports only ""failed to load plugin"" with line 0 (0), exactly as a user saw on v0.7.1 and v0.8.0. Build with -static so that no MinGW runtime library is needed at load time."
            exit 1
          }
          Write-Host "the dll needs only the operating system's own libraries"

      - name: keep the dll
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-dll
          path: nvmidi.dll
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build a release ships, and the backend is the whole point.
      #
      # A bare "make" here used to select ALSA, and ALSA is exactly what must
      # not be shipped: defining __LINUX_ALSA__ puts a "needed: libasound.so.2"
      # entry into the library, and a machine without ALSA has the loader
      # reject the entire library before a single symbol is looked up. The
      # engine then says "failed to load plugin", the script never runs, and
      # nothing on the user's side can tell this apart from a missing file.
      # Measured on the real engine; this is the bug a user reported as
      # "failed to load plugin всё равно" after downloading v0.7.1.
      #
      # The dummy build needs libc and libstdc++ only, so the loader always
      # takes it on a stock linux, and it says so through midi_api_name_byte().
      # Nothing else is built here: an alsa build in a release is a trap, not
      # a fallback, because the error it produces names nothing.
      - name: build the library a release ships
        run: make MIDI_BACKEND=dummy

      # The dependency list is asserted rather than trusted. The whole failure
      # mode above is invisible in the file contents: the library is complete
      # and healthy, and only this list makes it unloadable. readelf is the
      # runner's own, so this costs no setup.
      - name: assert the library needs nothing a stock machine lacks
        run: |
          set -euo pipefail
          readelf -d nvmidi.so | grep -E 'NEEDED|SONAME' || true
          if readelf -d nvmidi.so | grep -q 'libasound'; then
            echo "::error::this library needs libasound.so.2, so the loader will reject it on a machine without ALSA and the engine will report only \"failed to load plugin\""
            exit 1
          fi

      - name: keep the so
        uses: actions/upload-artifact@v4
        with:
          name: nvmidi-so
          path: nvmidi.so
          if-no-files-found: error

  # Only a tag push makes a release. A manual dispatch of this workflow still
  # gets the artifacts above, but must not invent a version number - a release
  # with a guessed tag is worse than no release.
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nvmidi-dll
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: nvmidi-so
          path: assets

      - name: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l assets
          gh release create "$GITHUB_REF_NAME" assets/nvmidi.dll assets/nvmidi.so \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
